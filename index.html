<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tabula Anatomica II: living specimen</title>
<style>
:root{--ground:#0d0b0a;--paper:#171311;--paper2:#1c1714;--bone:#cdbca5;--ink:#a8998a;--dim:#76695c;--rule:#2d2621;
 --blood:#8a2a1c;--blood2:#b0412c;--ochre:#b08a4e;
 --serif:"Iowan Old Style","Baskerville","Palatino","Georgia",serif;--sans:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:11px;line-height:1.35;overflow:hidden;overscroll-behavior:none}
#cv{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:block;touch-action:none}
.scan{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1;opacity:.22;
 background:linear-gradient(rgba(18,16,13,0) 50%,rgba(0,0,0,.35) 50%);background-size:100% 3px}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;height:calc(20px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
 padding-left:8px;padding-right:8px;display:flex;align-items:center;gap:10px;background:rgba(13,11,10,.82);border-bottom:1px solid var(--rule);white-space:nowrap}
#hud .brand{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--bone);flex:0 0 auto}
#hudtxt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
#hudtxt span{margin-right:11px}#hudtxt .vc{color:var(--bone)}
#hud .build{flex:0 0 auto;font-size:9px;color:var(--dim)}
#deck{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--rule);display:flex;flex-direction:column;
 padding-bottom:env(safe-area-inset-bottom,0px)}
#strip{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:4px 6px;overflow-x:auto;background:var(--paper2);border-bottom:1px solid var(--rule);scrollbar-width:none}
#strip::-webkit-scrollbar,#tabs::-webkit-scrollbar{display:none}
#strip .sep{flex:0 0 1px;align-self:stretch;background:var(--rule);margin:0 3px}
#ctx{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:3px 6px;min-height:27px;overflow-x:auto;background:var(--ground);border-bottom:1px solid var(--rule);scrollbar-width:none}
#ctx::-webkit-scrollbar{display:none}
#ctx .sep{flex:0 0 1px;align-self:stretch;background:var(--rule);margin:0 3px}
#ctx .note{flex:0 0 auto;color:var(--dim);font-size:10px;white-space:nowrap;margin-left:4px}
#ctx button{padding:2px 7px;font-size:10px}
.sr.mini{flex:0 0 auto;grid-template-columns:auto 74px 30px;gap:5px;height:21px}
.sr.mini label{color:var(--dim);font-size:10px}
.sr.mini .v{font-size:10px}
button.lnk{border:none;padding:0;font-size:9.5px;color:var(--dim);text-decoration:underline;text-underline-offset:2px}
#tabs{flex:0 0 auto;display:flex;overflow-x:auto;border-bottom:1px solid var(--rule);scrollbar-width:none}
#tabs .sp{flex:1 1 auto}
#pane{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 9px 14px}
button{font:inherit;font-size:10.5px;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:2px;padding:3px 8px;white-space:nowrap;touch-action:manipulation;cursor:pointer}
button.on{color:var(--bone);border-color:var(--blood);background:rgba(138,42,28,.22)}
button:disabled{opacity:.3}
button:focus-visible,input:focus-visible{outline:1px solid var(--bone);outline-offset:1px}
.tab{border:none;border-right:1px solid var(--rule);border-radius:0;padding:4px 10px}
.tab.on{background:var(--ground);color:var(--bone);box-shadow:inset 0 -2px 0 var(--blood)}
#deckBtn{border:none;border-left:1px solid var(--rule);border-radius:0;color:var(--dim)}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:10px 0 3px;padding-bottom:2px;border-bottom:1px dashed var(--rule)}
.gh span{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--bone)}
.gh em{font-style:normal;font-size:9.5px;color:var(--dim);text-align:right}
.sr{display:grid;grid-template-columns:minmax(92px,38%) 1fr 42px;align-items:center;gap:7px;height:23px}
.sr label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr .v{text-align:right;color:var(--bone);font-variant-numeric:tabular-nums;cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#3a312a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--bone);margin-top:-5.5px;border:none}
input[type=range]::-moz-range-track{height:2px;background:#3a312a}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--bone);border:none}
.row{display:flex;align-items:center;gap:5px;margin:5px 0}.row.wrap{flex-wrap:wrap}
.lbl{color:var(--ink);margin-right:2px}
#seed{width:72px;font:inherit;font-size:12px;color:var(--bone);background:var(--ground);border:1px solid var(--rule);border-radius:2px;padding:2px 5px;-webkit-user-select:text;user-select:text}
.desc{color:var(--dim);margin:4px 0;max-width:62ch}
.desc .flav{display:block;margin-top:3px;font-family:var(--serif);font-style:italic;font-size:11.5px;color:#8c7e6f}
.pr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:4px 7px;border-left:2px solid transparent;border-bottom:1px solid #221c18;cursor:pointer}
.pr.on{border-left-color:var(--blood);background:rgba(138,42,28,.16)}
.pr .pn{color:var(--ink)}.pr.on .pn{color:var(--bone)}
.pr .lat{font-family:var(--serif);font-style:italic;font-size:11px;color:var(--dim)}
#verdict{margin:2px 0 6px}
#verdict .vt{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--bone);line-height:1.25}
#verdict .vs{color:var(--dim);margin-top:2px;max-width:62ch}
.sc{display:grid;grid-template-columns:minmax(120px,44%) 1fr;align-items:center;gap:8px;height:15px}
.sc span{color:var(--ink);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc b{display:block;height:3px;background:#241e1a;position:relative}.sc i{position:absolute;left:0;top:0;bottom:0;background:var(--ochre)}
.spark{position:relative;height:58px;margin:8px 0 2px;border-left:1px solid var(--rule)}
.spark canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.key{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:9.5px;color:var(--dim);margin-bottom:6px}
.key i{display:inline-block;width:9px;height:2px;margin-right:4px;vertical-align:middle}
.rep{display:grid;grid-template-columns:minmax(96px,32%) 1fr;gap:2px 10px;margin:4px 0}
.rep div:nth-child(odd){color:var(--dim)}.rep div:nth-child(even){color:var(--ink);font-variant-numeric:tabular-nums}
.at{padding:5px 0;border-bottom:1px solid #221c18}
.atn{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--bone)}
.ats{color:var(--dim);font-size:10px}
.lg{padding:2px 0;border-bottom:1px solid #1f1a16;color:var(--ink)}
.lg span{display:inline-block;min-width:44px;color:var(--dim);font-variant-numeric:tabular-nums}
#out{display:block;width:100%;height:90px;margin-top:4px;background:var(--ground);color:var(--ink);border:1px solid var(--rule);border-radius:2px;
 font:9.5px/1.3 ui-monospace,Menlo,monospace;padding:5px;resize:vertical;-webkit-user-select:text;user-select:text}
section[hidden]{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="scan"></div>
<div id="hud"><span class="brand">Tabula anatomica II</span><span id="hudtxt"></span><span class="build">build 2</span></div>
<div id="deck">
 <div id="ctx"></div>
 <div id="strip">
  <button id="bPlay">Pause</button><button id="bStep">Step</button><button id="bSnap">Snap</button><button id="bRegrow">Regrow</button>
  <span class="sep"></span>
  <button data-tool="view" class="on">Orbit</button><button data-tool="cut">Cut</button><button data-tool="inject">Inject</button><button data-tool="probe">Probe</button>
</div>
 <div id="tabs">
  <button class="tab on" data-tab="specimen">Specimen</button><button class="tab" data-tab="laws">Laws</button>
  <button class="tab" data-tab="autopsy">Autopsy</button><button class="tab" data-tab="atlas">Atlas</button><span class="sp"></span><button id="deckBtn">Hide</button>
 </div>
 <div id="pane">
  <section id="t-specimen"></section><section id="t-laws"></section><section id="t-autopsy"></section><section id="t-atlas"></section>
 </div>
</div>
<script>
'use strict';
// ===================== TABULA CORE — laws, organism, metrics, investigator (no DOM) =====================
const H=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);};
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

// [group, key, label, min, max, step, default, flag]   flag 'g' = regrows the specimen
const PDEF=[
['BODY','depth','Recursion depth',1,5,1,3,'g'],
['BODY','branch','Branching factor',2,3,1,2,'g'],
['BODY','nMem','Membrane nodes',60,400,10,200,'g'],
['BODY','nMid','Mid-tissue nodes',30,300,10,140,'g'],
['BODY','nCore','Core nodes',10,200,10,70,'g'],
['BODY','linkK','Links per node',3,10,1,6,'g'],
['BODY','linkR','Link reach',0.15,0.6,0.01,0.34,'g'],
['BODY','elong','Elongation',0.7,1.8,0.05,1.25,'g'],
['BODY','lobe','Lobing',0,1,0.05,0.45,'g'],
['BODY','settle','Settling steps',0,1500,10,700,'g'],
['ELASTIC','kBase','Fiber stiffness',5,150,1,40],
['ELASTIC','damp','Fiber damping',0,6,0.05,1.2],
['ELASTIC','drag','Medium friction',0,4,0.05,0.8],
['ELASTIC','turgor','Internal pressure',0,8,0.1,3],
['ELASTIC','repel','Crowding repulsion',0,40,0.5,12],
['ELASTIC','contain','Containment radius',1.5,5,0.1,3],
['ELASTIC','dt','Time step',0.004,0.03,0.001,0.016],
['ELASTIC','substeps','Substeps',1,6,1,3],
['DAMAGE','tol','Strain tolerance',0.05,0.6,0.01,0.22],
['DAMAGE','fatigue','Fatigue rate',0,20,0.1,4],
['DAMAGE','vuln','Damage vulnerability',0,2,0.05,1],
['DAMAGE','scarBrittle','Scar brittleness',0,0.9,0.01,0.45],
['DAMAGE','breakDmg','Break to node damage',0,1,0.01,0.22],
['DAMAGE','necroT','Starvation to necrosis (s)',0.5,20,0.5,6],
['ENERGY','intake','Membrane intake',0,2,0.01,0.35],
['ENERGY','budget','Intake budget per s',0,200,1,55],
['ENERGY','metab','Metabolic cost',0,0.4,0.005,0.05],
['ENERGY','cold','Environmental cold',0,1,0.01,0.08],
['ENERGY','diffuse','Diffusion',0,10,0.1,2.5],
['SIGNAL','spont','Spontaneous firing',0,2,0.01,0.08],
['SIGNAL','thresh','Firing threshold',0.05,2,0.01,0.45],
['SIGNAL','refract','Refractory (s)',0.05,3,0.01,0.6],
['SIGNAL','gain','Conduction gain',0,3,0.05,1],
['SIGNAL','fireCost','Firing cost',0,0.2,0.005,0.03],
['SIGNAL','contract','Contraction strength',0,0.5,0.01,0.11],
['SIGNAL','sigDecay','Contraction decay (s)',0.05,1,0.01,0.2],
['ADAPT','adapt','Load strengthening',0,2,0.05,0.4],
['ADAPT','atrophy','Disuse atrophy',0,2,0.05,0.15],
['ADAPT','hebb','Pathway reinforcement',0,2,0.05,0.5],
['ADAPT','repair','Repair rate',0,2,0.05,0.3],
['ADAPT','scarGain','Scarring per repair',0,2,0.05,0.8],
['ADAPT','recruit','Recruitment rate',0,3,0.05,0.35],
['ADAPT','recruitR','Recruitment reach',0.1,0.7,0.01,0.32],
['ADAPT','calcRate','Calcification rate',0,2,0.05,0.25],
['ADAPT','calcE','Calcify below energy',0,0.6,0.01,0.22],
['PRESSURE','pI','Pressure intensity',0,1,0.01,0.5],
['CLASSIFY','anomD','Anomaly threshold',0.1,1,0.01,0.34],
['CLASSIFY','baseD','Intact threshold',0.02,0.5,0.01,0.16],
['CLASSIFY','classEvery','Re-examine every (s)',0.25,5,0.25,1],
['INJECT','injR','Injection radius',0.05,0.9,0.01,0.28],
['INJECT','injI','Injection intensity',0,1,0.01,0.6],
['INJECT','headOff','Tool head offset (px)',0,160,2,72],
['VIEW','nodeSize','Node size',0.5,4,0.1,1.6],
['VIEW','fiberA','Fiber opacity',0.05,1,0.01,0.55],
['VIEW','ghostA','Removed-side ghost',0,0.3,0.01,0.04],
['VIEW','slab','Section thickness',0.01,0.3,0.005,0.07],
['VIEW','camD','Camera distance',2,10,0.1,4.4],
];
const P={};for(const d of PDEF)P[d[1]]=d[6];
const LAW={damage:true,energy:true,signal:true,adapt:true};
const TISSUE=['core','mid','membrane','conduit'];

const PRESSURES=[
 {id:'none',num:'',lat:'',name:'No pressure',
  mech:'Baseline physiology only. The specimen lives under its own laws.',desc:''},
 {id:'dissolutio',num:'I',lat:'Dissolutio ego',name:'Boundary collapse',
  mech:'Raises internal pressure and slowly erodes the fibers binding the membrane to inner tissue.',
  desc:'The systemic failure of the ego-membrane. Nervous tissue unbinds from bone, dissolving identity into a continuous pool of anxiety.'},
 {id:'praedestinatio',num:'II',lat:'Praedestinatio aeterna',name:'Recursive damnation',
  mech:'Shortens the refractory period, strengthens contraction and excites the core, inviting re-entrant firing loops.',
  desc:'An infinite loop of structural condemnation. The rings of the soul-stem constrict iteratively; escape is mathematically impossible.'},
 {id:'necrosis',num:'III',lat:'Necrosis memoriae',name:'Erasure',
  mech:'Starves the membrane of intake and raises metabolic cost everywhere.',
  desc:'The calcification and flaking away of experiential registry. Nodes dry, blacken and detach, leaving voids in the architecture.'},
 {id:'inspectio',num:'IV',lat:'Inspectio invisibilis',name:'Continuous observation',
  mech:'Active interior tissue is drawn toward the observer. The gaze is your camera: where you look from matters.',
  desc:'An unblinking gaze mapped onto the optic chiasm. Every internal fiber reorients toward a focal point outside the vessel.'},
 {id:'barathrum',num:'V',lat:'Barathrum infinitum',name:'Abyssal fall',
  mech:'A dense sink opens below the thoracic center and pulls on all mass, with downward weight.',
  desc:'A gravitational anomaly within the thoracic cavity. Internal anchors snap one by one, dragging the arterial tree into a singularity.'},
];

let S=null;

function newOrg(N,FC){
 const f32=n=>new Float32Array(n);
 return {N,F:0,FC,
  x:f32(N),y:f32(N),z:f32(N),vx:f32(N),vy:f32(N),vz:f32(N),fx:f32(N),fy:f32(N),fz:f32(N),
  m:f32(N),tt:new Uint8Array(N),E:f32(N),sig:f32(N),ref:f32(N),acc:f32(N),acc2:f32(N),dE:f32(N),
  dC:f32(N),compounds:[],shots:0,
  dmg:f32(N),dead:new Uint8Array(N),calc:f32(N),mob:f32(N),starve:f32(N),fires:new Uint32Array(N),recruits:new Uint8Array(N),
  adj:Array.from({length:N},()=>[]),
  fa:new Int32Array(FC),fb:new Int32Array(FC),L0:f32(FC),Lr:f32(FC),km:f32(FC),kb:f32(FC),tolM:f32(FC),fat:f32(FC),
  cond:f32(FC),scar:f32(FC),sa:f32(FC),use:f32(FC),alive:new Uint8Array(FC),born:f32(FC),broke:f32(FC),rec:new Uint8Array(FC),
  time:0,tick:0,seed:1,turgScale:1,pressure:'none',sink:[0,-0.3,0],gaze:[0,0,-1],
  cx:0,cy:0,cz:0,Etis:new Float32Array(4),
  ring:new Float32Array(240),ringPos:0,fireAcc:0,fireT:0,
  cnt:{broken:0,formed:0,necro:0},
  win:{t:0,breaks:0,pairs:{},necro:0,recruit:0},
  events:[],init:null,rmin:0.1,cell:0.2,
  pairs:new Int32Array(N*24),np:0,
  gHead:new Int32Array(4096),gNext:new Int32Array(N),stamp:new Int32Array(N),st:0
 };
}
function ev(text){if(S)S.events.push({t:S.time,text});}
function pairName(a,b){const n=[TISSUE[a],TISSUE[b]].sort();return n[0]===n[1]?n[0]:n[0]+'–'+n[1];}

function addFiber(o,a,b,L0,km,kb,tolM,cond,rec,Lr){
 if(o.F>=o.FC)return -1;const f=o.F++;
 o.fa[f]=a;o.fb[f]=b;o.L0[f]=L0;o.Lr[f]=Lr||L0;o.km[f]=km;o.kb[f]=kb;o.tolM[f]=tolM;o.cond[f]=cond;
 o.fat[f]=0;o.scar[f]=0;o.sa[f]=0;o.use[f]=0;o.alive[f]=1;o.born[f]=o.time;o.broke[f]=-1;o.rec[f]=rec?1:0;
 o.adj[a].push(f);o.adj[b].push(f);return f;
}

// ---------- growth: a viable, recursively organized starting anatomy ----------
function grow(seed){
 seed=Math.floor(Math.abs(seed))||1;
 const h=(i,j)=>H(i*1.6180339+seed*0.1371,j*2.7182818+seed*0.0917);
 const ax=1,ay=P.elong,az=0.85;
 const q0=h(4,4)*6.283,q1=h(1,1)*6.283,q2=h(2,2)*6.283,q3=h(3,3)*6.283;
 const shapeR=(dx,dy,dz)=>{const th=Math.atan2(dz,dx),ph=Math.acos(clamp(dy,-1,1)),sp=Math.sin(ph);
  return Math.max(0.6,1+P.lobe*(0.2*Math.sin(2*th+q1)*sp*sp+0.13*Math.cos(3*ph+q2)+0.1*Math.sin(3*th+q3)*sp));};
 const frac=(x,y,z)=>{const qx=x/ax,qy=y/ay,qz=z/az,r=Math.hypot(qx,qy,qz);return r<1e-6?0:r/shapeR(qx/r,qy/r,qz/r);};
 const pts=[],typ=[];
 const put=(dx,dy,dz,f,t)=>{const r=shapeR(dx,dy,dz)*f;pts.push([dx*r*ax,dy*r*ay,dz*r*az]);typ.push(t);};
 const nM=P.nMem|0;
 for(let i=0;i<nM;i++){const yy=1-2*(i+0.5)/nM,rr=Math.sqrt(1-yy*yy),th=i*2.399963229+q0;put(Math.cos(th)*rr,yy,Math.sin(th)*rr,1,2);}
 // interior: 3D R-sequence (no Math.random)
 const g=1.2207440846057596,A=[1/g,1/(g*g),1/(g*g*g)],off=[h(5,1),h(5,2),h(5,3)];
 let n=0;
 const fill=(count,lo,hi,t)=>{let got=0,guard=0;while(got<count&&guard<400000){guard++;n++;
  const ux=((off[0]+n*A[0])%1)*2-1,uy=((off[1]+n*A[1])%1)*2-1,uz=((off[2]+n*A[2])%1)*2-1,f=Math.hypot(ux,uy,uz);
  if(f<lo||f>hi||f<1e-6)continue;put(ux/f,uy/f,uz/f,f,t);got++;}};
 fill(P.nMid|0,0.46,0.86,1);
 fill(P.nCore|0,0,0.42,0);
 // conduit tree: recursive branching, breadth-first so depth stays balanced under the cap
 const links=[];pts.push([0,0,0]);typ.push(3);const c0=pts.length-1;
 const Q=[{from:c0,p:[0,0,0],d:[0,1,0],len:0.34*ay,depth:P.depth|0},{from:c0,p:[0,0,0],d:[0,-1,0],len:0.34*ay,depth:P.depth|0}];
 let qi=0,tn=0;const cap=420;
 while(qi<Q.length&&tn<cap){const b=Q[qi++];let prev=b.from,p=b.p,d=b.d,ok=true;
  for(let s=0;s<3;s++){tn++;
   let dx=d[0]+0.3*(h(tn,11)-0.5),dy=d[1]+0.3*(h(tn,12)-0.5),dz=d[2]+0.3*(h(tn,13)-0.5);const dl=Math.hypot(dx,dy,dz);d=[dx/dl,dy/dl,dz/dl];
   const np=[p[0]+d[0]*b.len/3,p[1]+d[1]*b.len/3,p[2]+d[2]*b.len/3];
   if(frac(np[0],np[1],np[2])>0.84){ok=false;break;}
   pts.push(np);typ.push(3);links.push([prev,pts.length-1]);prev=pts.length-1;p=np;}
  if(ok&&b.depth>0){
   const rf=Math.abs(d[1])<0.9?[0,1,0]:[1,0,0];
   let ux=d[1]*rf[2]-d[2]*rf[1],uy=d[2]*rf[0]-d[0]*rf[2],uz=d[0]*rf[1]-d[1]*rf[0];const ul=Math.hypot(ux,uy,uz);ux/=ul;uy/=ul;uz/=ul;
   const wx=d[1]*uz-d[2]*uy,wy=d[2]*ux-d[0]*uz,wz=d[0]*uy-d[1]*ux;
   const ph=h(tn,17)*6.283,B=P.branch|0;
   for(let c=0;c<B;c++){const a=ph+c*6.283/B,ca=Math.cos(a)*0.85,sa=Math.sin(a)*0.85;

  o.m[i]=[1.3,1.0,0.8,0.7][typ[i]];o.E[i]=0.62+0.2*h(i,5);}
 const Ls=[];
 for(let fi=0;fi<fl.length;fi++){const [a,b]=fl[fi],ta=typ[a],tb=typ[b],has=t=>ta===t||tb===t;
  let kb=1,c=0.25,tm=1;

  else if(ta===2&&tb===2){kb=1.25;c=0.12;tm=1.15;}else if(has(2)){kb=1.0;c=0.14;tm=1.05;}

 // physiological reference: tolerance is judged against the settled, pressurized state
 for(let f=0;f<o.F;f++){const a=o.fa[f],b=o.fb[f];o.Lr[f]=Math.max(1e-4,Math.hypot(o.x[b]-o.x[a],o.y[b]-o.y[a],o.z[b]-o.z[a]));o.sa[f]=0;o.fat[f]=0;}
 o.vx.fill(0);o.vy.fill(0);o.vz.fill(0);o.mob.fill(0);

// ---------- spatial grid ----------
function gkey(ix,iy,iz){return ((ix*73856093)^(iy*19349663)^(iz*83492791))&4095;}
function buildGrid(){const o=S,c=o.cell;o.gHead.fill(-1);
 for(let i=0;i<o.N;i++){const k=gkey(Math.floor(o.x[i]/c),Math.floor(o.y[i]/c),Math.floor(o.z[i]/c));o.gNext[i]=o.gHead[k];o.gHead[k]=i;}}
function query(px,py,pz,r,cb){const o=S,c=o.cell,R=Math.ceil(r/c),ix=Math.floor(px/c),iy=Math.floor(py/c),iz=Math.floor(pz/c);

 for(let dx=-R;dx<=R;dx++)for(let dy=-R;dy<=R;dy++)for(let dz=-R;dz<=R;dz++){const k=gkey(ix+dx,iy+dy,iz+dz);
  for(let j=o.gHead[k];j!==-1;j=o.gNext[j]){if(o.stamp[j]===st)continue;o.stamp[j]=st;cb(j);}}}
function buildPairs(){const o=S;buildGrid();o.np=0;const r=o.rmin*1.3,r2=r*r;
 for(let i=0;i<o.N;i++){const xi=o.x[i],yi=o.y[i],zi=o.z[i];
  query(xi,yi,zi,r,j=>{if(j<=i)return;const dx=o.x[j]-xi,dy=o.y[j]-yi,dz=o.z[j]-zi;
   if(dx*dx+dy*dy+dz*dz<r2){if(o.np+2>o.pairs.length){const np=new Int32Array(o.pairs.length*2);np.set(o.pairs);o.pairs=np;}
    o.pairs[o.np++]=i;o.pairs[o.np++]=j;}});}}

// ---------- Layer 1: mechanics ----------
function breakFiber(f,cause){const o=S;if(!o.alive[f])return;o.alive[f]=0;o.broke[f]=o.time;o.cnt.broken++;
 const a=o.fa[f],b=o.fb[f];
 if(cause!=='necrosis'){o.dmg[a]=Math.min(1,o.dmg[a]+P.breakDmg);o.dmg[b]=Math.min(1,o.dmg[b]+P.breakDmg);}
 o.win.breaks++;const k=pairName(o.tt[a],o.tt[b]);o.win.pairs[k]=(o.win.pairs[k]||0)+1;}

function step(dt){
 const o=S,N=o.N,x=o.x,y=o.y,z=o.z,vx=o.vx,vy=o.vy,vz=o.vz,fx=o.fx,fy=o.fy,fz=o.fz;
 fx.fill(0);fy.fill(0);fz.fill(0);
 const I=P.pI,pr=o.pressure;
 let cx=0,cy=0,cz=0,cn=0;
 for(let i=0;i<N;i++){if(o.dead[i]||x[i]!==x[i])continue;cx+=x[i];cy+=y[i];cz+=z[i];cn++;}
 if(cn){cx/=cn;cy/=cn;cz/=cn;}o.cx=cx;o.cy=cy;o.cz=cz;
 const kB=P.kBase,damp=P.damp,contr=LAW.signal?P.contract*(pr==='praedestinatio'?1+2.5*I:1):0;

 for(let f=0;f<o.F;f++){if(!o.alive[f])continue;
  const a=o.fa[f],b=o.fb[f];
  let dx=x[b]-x[a],dy=y[b]-y[a],dz=z[b]-z[a];const L=Math.sqrt(dx*dx+dy*dy+dz*dz);if(!(L>1e-7))continue;
  dx/=L;dy/=L;dz/=L;
  const ta=o.tt[a],tb=o.tt[b];
  let sg=0;if(contr>0){sg=o.sig[a]>o.sig[b]?o.sig[a]:o.sig[b];if(ta===2||tb===2)sg*=0.35;}
  const L0=o.L0[f],rest=L0*(1-contr*sg),ca=(o.calc[a]+o.calc[b])*0.5,integ=1-o.fat[f];

   if(r>1e-6){const s=turg*0.6/r;fx[i]+=dx*s;fy[i]+=dy*s;fz[i]+=dz*s;}}

function computeTissueMeans(){const o=S,s=[0,0,0,0],c=[0,0,0,0];
 for(let i=0;i<o.N;i++){if(o.dead[i])continue;s[o.tt[i]]+=o.E[i];c[o.tt[i]]++;}
 for(let t=0;t<4;t++)o.Etis[t]=c[t]?s[t]/c[t]:0;}

function killNode(i){const o=S;if(o.dead[i])return;o.dead[i]=1;o.E[i]=0;o.sig[i]=0;o.cnt.necro++;o.win.necro++;
 for(const f of o.adj[i])breakFiber(f,'necrosis');}

// ---------- per-frame laws: signal, energy, adaptation (Layer 1 + 2) ----------
function frameLaws(dtf){
 const o=S,N=o.N,I=P.pI,pr=o.pressure;
 // SIGNAL
 let fired=0;
 if(LAW.signal){
  const p2=pr==='praedestinatio'?I:0,refrE=P.refract*(1-0.85*p2),decay=Math.exp(-dtf/P.sigDecay);
  const coreBoost=1+3*p2,gainE=P.gain*(1+0.8*p2),acc=o.acc,acc2=o.acc2;
  for(let i=0;i<N;i++){
   if(o.dead[i]){o.sig[i]=0;continue;}
   o.sig[i]*=decay;if(o.ref[i]>0)o.ref[i]-=dtf;
   let fire=false;
   if(o.ref[i]<=0&&o.E[i]>0.05){
    if(acc[i]>=P.thresh)fire=true;
    else{const t=o.tt[i],tm=t===0?1.5*coreBoost:t===3?1:t===1?0.5:0.25;
     const pS=P.spont*dtf*o.E[i]*tm*(1-o.calc[i]);
     if(H(i*0.7311+o.seed*0.013,o.tick*0.6180339+0.5)<pS)fire=true;}
   }
   if(fire){
    o.sig[i]=1;o.ref[i]=refrE*(0.85+0.3*H(i,o.tick*1.3));fired++;o.fires[i]++;
    if(LAW.energy)o.E[i]-=P.fireCost;
    const ei=clamp(o.E[i]*1.6,0.3,1);
    for(const f of o.adj[i]){if(!o.alive[f])continue;const j=o.fa[f]===i?o.fb[f]:o.fa[f];if(o.dead[j])continue;
     acc2[j]+=gainE*o.cond[f]*(1-o.fat[f])*ei;o.use[f]+=1;}
   }
  }
  o.acc=acc2;o.acc2=acc;acc.fill(0);
 }else{for(let i=0;i<N;i++){o.sig[i]*=0.8;o.acc[i]=0;}}
 o.ring[o.ringPos]=fired;o.ringPos=(o.ringPos+1)%o.ring.length;o.fireAcc+=fired;o.fireT+=dtf;
 // ENERGY
 if(LAW.energy){
  const nI=pr==='necrosis'?1-0.85*I:1,mM=pr==='necrosis'?1+I:1;
  let req=0;
  for(let i=0;i<N;i++)if(o.tt[i]===2&&!o.dead[i])req+=P.intake*(1-0.75*o.calc[i])*nI;
  const sc=req>P.budget&&req>0?P.budget/req:1;
  const dE=o.dE;dE.fill(0);
  for(let f=0;f<o.F;f++){if(!o.alive[f])continue;const a=o.fa[f],b=o.fb[f];if(o.dead[a]||o.dead[b])continue;
   const c=Math.min(P.diffuse*(0.15+0.85*o.cond[f])*(1-o.fat[f])*dtf,0.08),fl=c*(o.E[a]-o.E[b]);dE[a]-=fl;dE[b]+=fl;}
  for(let i=0;i<N;i++){if(o.dead[i])continue;const t=o.tt[i];
   let e=o.E[i]+dE[i]-P.metab*mM*(t===0?1.3:t===3?0.8:1)*dtf;
   if(t===2)e+=P.intake*(1-0.75*o.calc[i])*nI*sc*dtf-P.cold*dtf;
   o.E[i]=e<0?0:(e>1?1:e);}
  if(LAW.damage){for(let i=0;i<N;i++){if(o.dead[i])continue;
   if(o.E[i]<0.02)o.starve[i]+=dtf;else o.starve[i]=Math.max(0,o.starve[i]-dtf*0.5);
   if(o.starve[i]>P.necroT)killNode(i);}}
 }else{for(let i=0;i<N;i++)if(!o.dead[i])o.E[i]=0.7;}
 // ADAPTATION
 if(LAW.adapt){
  const du=Math.exp(-dtf/2),en=LAW.energy;
  for(let f=0;f<o.F;f++){if(!o.alive[f])continue;const a=o.fa[f],b=o.fb[f];
   const tolF=P.tol*o.tolM[f],s=o.sa[f];
   if(s>0.35*tolF&&s<tolF){
    o.km[f]=Math.min(o.km[f]+P.adapt*dtf*0.1,4*o.kb[f]);o.tolM[f]=Math.min(o.tolM[f]+P.adapt*dtf*0.004,2);
    if(en){const c=0.003*P.adapt*dtf;o.E[a]=Math.max(0,o.E[a]-c);o.E[b]=Math.max(0,o.E[b]-c);}
   }else if(s<0.05*tolF&&o.use[f]<0.05){
    o.km[f]=Math.max(o.km[f]-P.atrophy*dtf*0.05,0.3*o.kb[f]);
   }
   const u=o.use[f];
   o.cond[f]=clamp(o.cond[f]+P.hebb*dtf*(0.06*u*(1-o.cond[f])-0.015*o.cond[f]*(1+P.atrophy*0.5)),0.02,1);
   o.use[f]*=du;
   if(o.fat[f]>0&&LAW.damage&&(!en||(o.E[a]>0.35&&o.E[b]>0.35))){
    const r=Math.min(o.fat[f],P.repair*dtf*0.05);o.fat[f]-=r;o.scar[f]=Math.min(1,o.scar[f]+r*P.scarGain);
    if(en){o.E[a]=Math.max(0,o.E[a]-r*0.4);o.E[b]=Math.max(0,o.E[b]-r*0.4);}
   }
  }
  if(en)for(let i=0;i<N;i++){if(o.dead[i])continue;
   if(o.E[i]<P.calcE&&o.mob[i]<0.04)o.calc[i]=Math.min(1,o.calc[i]+P.calcRate*dtf*0.08);}
  if(LAW.damage&&P.recruit>0){
   const rr=P.recruitR,rr2=rr*rr;
   for(let i=0;i<N;i++){
    if(o.dead[i]||o.dmg[i]<0.12||(en&&o.E[i]<0.45))continue;
    const p=P.recruit*dtf*o.dmg[i]/(1+o.recruits[i]);
    if(H(i*1.91+3.3,o.tick*0.7071+0.25)>=p)continue;
    let best=-1,bd=rr2;const xi=o.x[i],yi=o.y[i],zi=o.z[i];
    query(xi,yi,zi,rr,j=>{if(j===i||o.dead[j])return;const dx=o.x[j]-xi,dy=o.y[j]-yi,dz=o.z[j]-zi,d2=dx*dx+dy*dy+dz*dz;
     if(d2<bd){for(const f of o.adj[i]){if(o.alive[f]&&(o.fa[f]===j||o.fb[f]===j))return;}bd=d2;best=j;}});
    if(best>=0){const d=Math.sqrt(bd);
     if(addFiber(o,i,best,Math.max(1e-3,d*0.92),0.45,0.6,0.8,0.3,1,Math.max(1e-3,d))>=0){
      o.recruits[i]=Math.min(255,o.recruits[i]+1);o.cnt.formed++;o.win.recruit++;if(en)o.E[i]=Math.max(0,o.E[i]-0.12);}}
   }
  }
 }
 frameCompounds(dtf);
 computeTissueMeans();
 o.time+=dtf;o.tick++;
 o.win.t+=dtf;if(o.win.t>=1)flushWin();
}
function flushWin(){const o=S,w=o.win;
 if(w.breaks>=5){const top=Object.entries(w.pairs).sort((a,b)=>b[1]-a[1])[0];ev(`${w.breaks} fibers failed, mostly ${top[0]}`);}
 if(w.necro>0)ev(`${w.necro} node${w.necro>1?'s':''} died of starvation`);
 if(w.recruit>=3)ev(`${w.recruit} new fibers recruited around damage`);
 w.t=0;w.breaks=0;w.pairs={};w.necro=0;w.recruit=0;}

// ---------- measurement ----------
function rhythm(){const o=S,RL=o.ring.length,a=new Float32Array(RL);

 {id:'dissolutio',num:'I',name:'Boundary collapse',f:{detach:0.7,broken:0.4,expand:0.3,collapse:0}},
 {id:'praedestinatio',num:'II',name:'Recursive damnation',f:{rhythm:0.85,firing:0.7,frag:0,necro:0,broken:0,asym:0,collapse:0}},
 {id:'necrosis',num:'III',name:'Erasure',f:{necro:0.7,starved:0.7,firing:0}},
 {id:'inspectio',num:'IV',name:'Continuous observation',f:{asym:0.8,strain:0.3,collapse:0,necro:0}},

const COMPOUND_FX=['stiffen','conduct','nourish','calcify','toughen','excite','swell'];

function fileAtlas(kind){if(!S||!cls||!feat)return;
 const nA=atlas.filter(a=>a.kind==='anomaly').length+1,nR=atlas.filter(a=>a.kind!=='anomaly').length+1;
 const fr={};for(const k in feat)fr[k]=+feat[k].toFixed(2);
 const rec={id:kind==='anomaly'?`Anomaly ${nA}`:`Record ${nR}`,kind,seed:S.seed,t:+S.time.toFixed(1),pressure:S.pressure,pressureLabel:pLabel(S.pressure),
  intensity:+P.pI.toFixed(2),verdict:clsText(cls),confidence:+cls.conf.toFixed(2),name:cls.name||null,
  nearest:cls.nearNum?`Fig. ${cls.nearNum}`:null,features:fr,laws:{...LAW},filed:new Date().toISOString()};
 atlas.unshift(rec);saveAtlas();
 ev(kind==='anomaly'?`Filed to atlas as ${rec.id}: ${cls.name}`:`Filed to atlas: ${rec.verdict}`);refreshPanel(true);}
function specimenJSON(){const o=S;
 const nodes=[];for(let i=0;i<o.N;i++)nodes.push([r3(o.x[i]),r3(o.y[i]),r3(o.z[i]),o.tt[i],r3(o.E[i]),r3(o.dmg[i]),r3(o.calc[i]),o.dead[i]]);
 const fibers=[];for(let f=0;f<o.F;f++)if(o.alive[f])fibers.push([o.fa[f],o.fb[f],r3(o.cond[f]),r3(o.scar[f]),r3(o.fat[f]),o.rec[f]]);
 const m={};if(metrics)for(const k in metrics)m[k]=typeof metrics[k]==='number'?r3(metrics[k]):metrics[k];
 const fr={};if(feat)for(const k in feat)fr[k]=r3(feat[k]);
 return JSON.stringify({format:'TABULA_SPECIMEN',build:+BUILD,seed:o.seed,time:r3(o.time),pressure:o.pressure,intensity:P.pI,laws:{...LAW},params:{...P},
  verdict:clsText(cls),confidence:cls?r3(cls.conf):null,metrics:m,features:fr,
  nodeFields:['x','y','z','tissue(0 core,1 mid,2 membrane,3 conduit)','energy','damage','calcification','dead'],nodes,
  fiberFields:['a','b','conductivity','scar','fatigue','recruited'],fibers,
  history:o.events.map(e=>[r3(e.t),e.text])});}
function copyOut(text,label){const out=$('out');out.value=text;const st=$('cpStatus');
 const fallback=()=>{try{out.focus();out.select();out.setSelectionRange(0,text.length);const ok=document.execCommand('copy');
  st.textContent=ok?`${label} copied.`:`${label} is in the box below. Select it and copy.`;}catch(_){st.textContent=`${label} is in the box below. Select it and copy.`;}};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>{st.textContent=`${label} copied (${(text.length/1024).toFixed(0)} KB). Also in the box below.`;},fallback);
 else fallback();}

// ---------- deck UI ----------
const sliders={};
function sliderRow(key){const d=PDEF.find(x=>x[1]===key);const row=document.createElement('div');row.className='sr';
 const lab=document.createElement('label');lab.textContent=d[2];
 const inp=document.createElement('input');inp.type='range';inp.min=d[3];inp.max=d[4];inp.step=d[5];inp.value=P[key];
 const val=document.createElement('span');val.className='v';val.title='Tap to restore default';
 const fmt=v=>d[5]>=1?String(Math.round(v)):(+v).toFixed(d[5]<0.01?3:2);
 val.textContent=fmt(P[key]);
 inp.addEventListener('input',()=>{P[key]=+inp.value;val.textContent=fmt(P[key]);});
 inp.addEventListener('change',()=>{if(d[7]==='g')regrowSoon();if(key==='pI'&&S&&S.pressure!=='none')ev(`Pressure intensity set to ${P.pI.toFixed(2)}`);});
 val.addEventListener('click',()=>{P[key]=d[6];inp.value=d[6];val.textContent=fmt(d[6]);if(d[7]==='g')regrowSoon();});
 row.append(lab,inp,val);sliders[key]={inp,val,fmt};return row;}
function syncSlider(k){const s=sliders[k];if(s){s.inp.value=P[k];s.val.textContent=s.fmt(P[k]);}}
function groupSliders(container,group){for(const d of PDEF)if(d[0]===group)container.appendChild(sliderRow(d[1]));}
function gh(text,note){const el=document.createElement('div');el.className='gh';el.innerHTML=`<span>${text}</span>${note?`<em>${note}</em>`:''}`;return el;}

const LAWNAME={damage:'Damage and history',energy:'Energy',signal:'Signal and contraction',adapt:'Adaptation and repair'};
const DISPLAY_KEYS=['nodeSize','fiberA','ghostA','camD','headOff'];
function buildDeck(){
 // specimen: pressure + body plan
 const sp=$('t-specimen');
 sp.appendChild(gh('Pathological pressure','applied continuously; the outcome is not scripted'));
 const pl=document.createElement('div');pl.id='plist';sp.appendChild(pl);
 const pd=document.createElement('div');pd.id='pdesc';pd.className='desc';sp.appendChild(pd);
 sp.appendChild(sliderRow('pI'));
 sp.appendChild(gh('Body plan','changes regrow the specimen'));
 const seedRow=document.createElement('div');seedRow.className='row';
 seedRow.innerHTML='<label class="lbl" for="seed">Seed</label><input id="seed" type="number" inputmode="numeric"><button id="seedNext">Next seed</button>';
 sp.appendChild(seedRow);groupSliders(sp,'BODY');
 const ct=document.createElement('div');ct.id='counts';ct.className='desc';sp.appendChild(ct);
 // laws (+ display at the bottom)
 const lw=$('t-laws');
 const tg=document.createElement('div');tg.className='row wrap';tg.id='lawtog';lw.appendChild(tg);
 for(const k of ['damage','energy','signal','adapt']){const b=document.createElement('button');b.dataset.law=k;b.textContent=LAWNAME[k];
  b.addEventListener('click',()=>{LAW[k]=!LAW[k];ev(`Law ${LAW[k]?'restored':'suspended'}: ${LAWNAME[k].toLowerCase()}`);renderLaws();});tg.appendChild(b);}
 const ld=document.createElement('div');ld.className='desc';ld.textContent='Tap a law to suspend it and measure what it contributes. Tap any value to restore its default.';lw.appendChild(ld);
 lw.appendChild(gh('Elasticity','always on'));groupSliders(lw,'ELASTIC');
 lw.appendChild(gh('Damage and history'));groupSliders(lw,'DAMAGE');
 lw.appendChild(gh('Energy'));groupSliders(lw,'ENERGY');
 lw.appendChild(gh('Signal and contraction'));groupSliders(lw,'SIGNAL');
 lw.appendChild(gh('Adaptation and repair','every adaptation has a cost'));groupSliders(lw,'ADAPT');
 lw.appendChild(gh('Investigator','how readily it names or gives up'));groupSliders(lw,'CLASSIFY');
 lw.appendChild(gh('Display'));for(const k of DISPLAY_KEYS)lw.appendChild(sliderRow(k));
 // autopsy (+ snapshot comparison)
 $('t-autopsy').innerHTML='<div id="verdict"></div><div id="scores"></div><div class="spark"><canvas id="spark"></canvas></div><div id="sparkkey" class="key"></div>'+
  '<div class="gh"><span>Since snapshot</span><em><button id="clrSnap" class="lnk">Discard</button></em></div><div id="memrep"></div>'+
  '<div class="gh"><span>Report</span><em><button id="fileB" class="lnk">File to atlas</button></em></div><div id="report" class="rep"></div>';
 $('sparkkey').innerHTML=HK.map(k=>`<span><i style="background:${HCOL[k]}"></i>${HLAB[k]}</span>`).join('');
 // atlas (+ history)
 $('t-atlas').innerHTML='<div id="atlasList"></div><div class="row wrap"><button id="cpAtlas">Copy atlas JSON</button><button id="cpSpec">Copy specimen JSON</button><button id="clrAtlas">Clear atlas</button></div><div id="cpStatus" class="desc"></div><textarea id="out" readonly spellcheck="false"></textarea>'+
  '<div class="gh"><span>History of this specimen</span></div><div id="logList"></div>';
 // wiring
 $('seed').value=seedVal;
 $('seed').addEventListener('change',()=>{const v=Math.floor(Math.abs(+$('seed').value))||1;seedVal=v;$('seed').value=v;regrow();});
 $('seedNext').addEventListener('click',()=>{seedVal=(seedVal*7919+104729)%99991||1;$('seed').value=seedVal;regrow();});
 $('fileB').addEventListener('click',()=>fileAtlas('record'));
 $('clrSnap').addEventListener('click',()=>{snap=null;if(viewMode==='diff')viewMode='tissue';buildCtx();refreshPanel(true);});
 $('cpAtlas').addEventListener('click',()=>copyOut(JSON.stringify({format:'TABULA_ATLAS',build:+BUILD,records:atlas},null,1),'Atlas'));
 $('cpSpec').addEventListener('click',()=>{if(S)copyOut(specimenJSON(),'Specimen');});
 let clrArm=0;$('clrAtlas').addEventListener('click',e=>{const b=e.currentTarget;
  if(Date.now()-clrArm<2500){atlas=[];saveAtlas();b.textContent='Clear atlas';refreshPanel(true);clrArm=0;}
  else{clrArm=Date.now();b.textContent='Tap again to clear';setTimeout(()=>{b.textContent='Clear atlas';},2500);}});
 renderPressures();renderLaws();
}
function renderPressures(){const pl=$('plist');pl.innerHTML='';
 for(const p of PRESSURES){const r=document.createElement('div');r.className='pr'+(p.id===curPressure?' on':'');
  r.innerHTML=p.id==='none'?'<span class="pn">No pressure</span>':`<span class="pn">${p.num}. ${p.name}</span><span class="lat">${p.lat}</span>`;
  r.addEventListener('click',()=>setPressure(p.id));pl.appendChild(r);}
 const p=PRESSURES.find(q=>q.id===curPressure);
 $('pdesc').innerHTML=`${p.mech}${p.desc?`<span class="flav">${p.desc}</span>`:''}`;}
function renderLaws(){document.querySelectorAll('#lawtog button').forEach(b=>b.classList.toggle('on',LAW[b.dataset.law]));}
const INJHINT={tear:'Outward impulse; fatigues every fiber in reach',chill:'Drains energy, calcifies',surge:'Forces the tissue to fire',
 mystery:'An unknown compound. Each new drag is a new one'};
// context row: only the active tool's options, one tap away
function miniSlider(key,label){const row=sliderRow(key);row.className='sr mini';row.firstChild.textContent=label;return row;}
function ctxBtn(text,on,fn,dis){const b=document.createElement('button');b.textContent=text;if(on)b.classList.add('on');if(dis)b.disabled=true;b.addEventListener('click',fn);return b;}
function ctxNote(t){const n=document.createElement('span');n.className='note';n.textContent=t;return n;}
function buildCtx(){const c=$('ctx');c.innerHTML='';
 if(tool==='view'){
  for(const k of Object.keys(VIEWNAME))c.appendChild(ctxBtn(k==='diff'?'Change':VIEWNAME[k],viewMode===k,()=>{viewMode=k;buildCtx();}, k==='diff'&&!snap));
  c.appendChild(sep());
  c.appendChild(ctxBtn('Follow',cam.follow,()=>{cam.follow=!cam.follow;buildCtx();}));
  c.appendChild(ctxBtn('Reset view',false,resetView));
 }else if(tool==='inject'){
  for(const k of Object.keys(INJ))c.appendChild(ctxBtn(INJ[k],injType===k,()=>{injType=k;buildCtx();}));
  c.appendChild(sep());c.appendChild(miniSlider('injR','Radius'));c.appendChild(miniSlider('injI','Dose'));
  c.appendChild(ctxNote(INJHINT[injType]));
 }else if(tool==='cut'){
  c.appendChild(ctxBtn('Flip',false,()=>{if(sec.on){sec.flip*=-1;ev('Section flipped: the other portion is removed');}},!sec.on));
  c.appendChild(ctxBtn('Close',false,()=>{if(sec.on){sec.on=false;ev('Section closed');buildCtx();}},!sec.on));
  c.appendChild(sep());c.appendChild(miniSlider('slab','Thickness'));
  c.appendChild(ctxNote(sec.on?'Orbit to inspect the exposed face':'Drag a line across the body'));
 }else{
  c.appendChild(ctxNote('Touch a node to read its state. The reticle rides above your finger.'));
 }}
function sep(){const s=document.createElement('span');s.className='sep';return s;}
function updateStrip(){
 $('bPlay').textContent=running?'Pause':'Resume';
 document.querySelectorAll('#strip [data-tool]').forEach(b=>{b.classList.toggle('on',b.dataset.tool===tool);
  if(b.dataset.tool==='view')b.textContent=cam.mode==='orbit'?'Orbit':'Trackball';});
 buildCtx();}
function updateCounts(){if(!S||!$('counts'))return;let tn=0;for(let i=0;i<S.N;i++)if(S.tt[i]===3)tn++;
 $('counts').textContent=`This specimen: ${S.N} nodes (${tn} in the conduit tree), ${S.F} fibers at birth. Room for ${S.FC-S.F} more fibers before growth stops.`;}

// ---------- panels ----------
function fmtT(t){return t.toFixed(1)+' s';}
function updateHUD(){if(!S)return;const m=metrics;const h=$('hudtxt');if(!m){h.textContent='';return;}
 const c=cls,vc=!c?'—':c.kind==='intact'?'intact':c.kind==='terror'?`Fig. ${c.num} ${Math.round(c.conf*100)}%`:'unclassified';
 const parts=[`<span>${fmtT(S.time)}</span>`,`<span>${m.alive} living</span>`,`<span>${m.broken} torn</span>`,
  `<span>${m.bodies} bod${m.bodies===1?'y':'ies'}${m.frags?` + ${m.frags} frag`:''}</span>`,`<span class="vc">${vc}</span>`];
 if(rhythmOn)parts.push(`<span>pulse ${m.period.toFixed(2)} s</span>`);
 if(S.pressure!=='none'){const p=PRESSURES.find(q=>q.id===S.pressure);parts.push(`<span>pressure ${p.num} ${P.pI.toFixed(2)}</span>`);}
 if(sec.on)parts.push('<span>sectioned</span>');
 if(S.compounds.length)parts.push(`<span>${S.compounds.map(c=>c.code.replace('Compound ','C')).join(' ')} in tissue</span>`);
 h.innerHTML=parts.join('');}
function featList(keys){return keys.map(k=>FEATNAME[k]).join(', ');}
function updateAutopsy(){const m=metrics,c=cls;if(!m||!c)return;
 let vt;if(c.kind==='intact')vt='Intact specimen';else if(c.kind==='terror')vt=`Consistent with Fig. ${c.num}, ${c.label.toLowerCase()}`;else vt=`Unclassified: ${c.name}`;
 let vs=`Confidence ${Math.round(c.conf*100)}%. Pressure applied: ${pLabel(S.pressure)}${S.pressure!=='none'?' at '+P.pI.toFixed(2):''}.`;
 if(c.kind==='anomaly'&&c.nearNum)vs+=` Nearest doctrine is Fig. ${c.nearNum}, but it does not fit.`;
 let ue=c.unexpl&&c.unexpl.length?`<div class="vs">Unexplained by this reading: ${featList(c.unexpl)}.</div>`:'';
 if(pend)ue+=`<div class="vs">Under review: findings drifting toward ${pend==='anomaly'?'no known figure':pend==='intact'?'an intact reading':'Fig. '+(PROTO.find(p=>p.id===pend)||{}).num}.</div>`;
 $('verdict').innerHTML=`<div class="vt">${vt}</div><div class="vs">${vs}</div>${ue}`;
 $('scores').innerHTML=c.scores.map(s=>{const sim=clamp(1-s.d/0.8,0,1);
  return `<div class="sc"><span>${s.id==='intact'?'Intact':s.num+'. '+s.name}</span><b><i style="width:${(sim*100).toFixed(0)}%"></i></b></div>`;}).join('');
 const rows=[
  ['Living nodes',`${m.alive} of ${m.N}${m.dead?`, ${m.dead} necrotic`:''}`],
  ['Connected bodies',`${m.bodies}${m.frags?`, plus ${m.frags} fragment${m.frags>1?'s':''}`:''}; largest holds ${(m.largestFrac*100).toFixed(0)}%`],
  ['Fibers',`${m.aliveF} intact, ${m.broken} torn, ${m.formedAlive} recruited and surviving`],
  ['Strain concentration',`peak ${(m.maxRel*100).toFixed(0)}% of tolerance; top 2% at ${(m.p98*100).toFixed(0)}%; inequality ${m.gini.toFixed(2)}`],
  ['Strain hotspot',m.hot||'—'],
  ['Surviving pathways',`${m.condF} conductive fibers; network reaches ${(m.condFrac*100).toFixed(0)}% of living nodes`],
  ['Energy',`core ${m.Ecore.toFixed(2)}, mid ${m.Emid.toFixed(2)}, shell ${m.Emem.toFixed(2)}, conduit ${m.Econd.toFixed(2)}`],
  ['Shell',`rigidity ${(m.memCalc*100).toFixed(0)}%; ${(m.detachFrac*100).toFixed(0)}% detached from interior`],
  ['Mobility',`interior ${m.mobCore.toFixed(3)}, shell ${m.mobMem.toFixed(3)}`],
  ['Rhythm',m.rhythmR>0.35?`period ${m.period.toFixed(2)} s, coherence ${m.rhythmR.toFixed(2)}`:'no coordinated rhythm'],
  ['Firing',`${m.fireRate.toFixed(2)} per node per second`],
  ['Compounds in tissue',S.compounds.length?S.compounds.map(c=>`${c.code} (load ${c.total.toFixed(1)}, effects unknown)`).join('; '):'none'],
  ['Repair history',`mean scarring ${m.scar.toFixed(3)}, mean fatigue ${m.fat.toFixed(3)}`],
  ['Shape',`shell radius ${(m.memR/S.init.memR*100).toFixed(0)}%, height ${(m.ystd/S.init.ystd*100).toFixed(0)}% of birth; interior offset ${m.asym.toFixed(3)}`]];
 $('report').innerHTML=rows.map(r=>`<div>${r[0]}</div><div>${r[1]}</div>`).join('');
 drawSpark();}
let spW=0,spH=0;
function sizeSpark(){const c=$('spark');if(!c)return;const b=c.parentElement.getBoundingClientRect();spW=b.width;spH=b.height;if(spW<1)return;c.width=Math.round(spW*DPR);c.height=Math.round(spH*DPR);}
function drawSpark(){const c=$('spark');if(!c)return;if(c.width<2)sizeSpark();if(spW<1)return;const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);
 x.clearRect(0,0,spW,spH);x.strokeStyle='#2d2621';x.lineWidth=1;x.beginPath();x.moveTo(0,spH-0.5);x.lineTo(spW,spH-0.5);x.stroke();
 for(const k of HK){const a=hist[k];if(!a||a.length<2)continue;x.beginPath();
  for(let i=0;i<a.length;i++){const px=i/(HIST_N-1)*spW,py=spH-2-a[i]*(spH-4);if(i)x.lineTo(px,py);else x.moveTo(px,py);}
  x.strokeStyle=HCOL[k];x.globalAlpha=0.85;x.lineWidth=1;x.stroke();}x.globalAlpha=1;}
function updateMemory(){const el=$('memrep');if(!el)return;
 if(!snap){el.innerHTML='<div class="desc">No snapshot yet. Tap Snap in the strip, let the specimen live, then compare here or switch Orbit to Change view.</div>';return;}
 if(!S||snap.N!==S.N){el.innerHTML='<div class="desc">The snapshot belongs to a different specimen. Discard it and preserve a new one.</div>';return;}
 const o=S,m=metrics;let torn=0,grown=0,died=0;
 for(let f=0;f<snap.F;f++)if(snap.alive[f]&&!o.alive[f])torn++;
 for(let f=snap.F;f<o.F;f++)if(o.alive[f])grown++;
 for(let i=0;i<o.N;i++)if(o.dead[i]&&!snap.dead[i])died++;
 const ds=[0,0,0,0],dc=[0,0,0,0];let mx=0,mi=-1;
 for(let i=0;i<o.N;i++){const a=(o.x[i]-o.cx)-snap.rx[i],b=(o.y[i]-o.cy)-snap.ry[i],c=(o.z[i]-o.cz)-snap.rz[i],d=Math.sqrt(a*a+b*b+c*c);ds[o.tt[i]]+=d;dc[o.tt[i]]++;if(d>mx){mx=d;mi=i;}}
 const drift=[0,1,2,3].map(t=>dc[t]?ds[t]/dc[t]:0);let most=0;for(let t=1;t<4;t++)if(drift[t]>drift[most])most=t;
 const fc=[];for(const k in feat){const d=feat[k]-(snap.f[k]||0);if(Math.abs(d)>0.08)fc.push(`${FEATNAME[k]} ${snap.f[k].toFixed(2)} → ${feat[k].toFixed(2)}`);}
 const rows=[['Elapsed',`${(o.time-snap.t).toFixed(1)} s since the snapshot at ${snap.t.toFixed(1)} s`],
  ['Verdict',`then ${snap.verdict}; now ${clsText(cls)}`],
  ['Torn since',`${torn} fibers`],['Grown since',`${grown} recruited fibers survive`],['Died since',`${died} nodes`],
  ['Bodies',`then ${snap.m.bodies}${snap.m.frags?` + ${snap.m.frags}`:''}, now ${m.bodies}${m.frags?` + ${m.frags}`:''}`],
  ['Drift by tissue',`core ${drift[0].toFixed(3)}, mid ${drift[1].toFixed(3)}, membrane ${drift[2].toFixed(3)}, conduit ${drift[3].toFixed(3)}`],
  ['Changed most',`${TISSNAME[most]}; largest single move ${mx.toFixed(3)} at node ${mi}`],
  ['Energy',`mean then ${snap.m.Emean.toFixed(2)}, now ${m.Emean.toFixed(2)}`],
  ['Findings shifted',fc.length?fc.join('; '):'no finding moved more than 0.08']];
 el.innerHTML=`<div class="rep">${rows.map(r=>`<div>${r[0]}</div><div>${r[1]}</div>`).join('')}</div><div class="desc">Change view: brighter tissue moved further; pale fibers grew after the snapshot; red fibers tore after it.</div>`;}
function renderAtlas(){const el=$('atlasList');if(!el)return;
 if(!atlas.length){el.innerHTML='<div class="desc">The atlas is empty. Anomalies file themselves when the investigator cannot match a figure; use File to atlas in Autopsy to record any reading.</div>';return;}
 el.innerHTML=atlas.slice(0,60).map(a=>{const top=Object.entries(a.features||{}).filter(e=>e[1]>=0.35).sort((x,y)=>y[1]-x[1]).slice(0,5).map(e=>`${FEATNAME[e[0]]||e[0]} ${e[1].toFixed(2)}`).join(', ');
  return `<div class="at"><div class="atn">${a.id}: ${a.name||a.verdict}</div><div class="ats">Seed ${a.seed} at ${a.t} s, pressure ${a.pressureLabel}${a.pressure!=='none'?` at ${a.intensity.toFixed(2)}`:''}, confidence ${Math.round(a.confidence*100)}%${a.nearest?`, nearest ${a.nearest}`:''}</div>${top?`<div class="ats">${top}</div>`:''}</div>`;}).join('');}
function renderLog(){const el=$('logList');if(!el)return;
 el.innerHTML=logs.length?logs.slice(-300).reverse().map(l=>`<div class="lg"><span>${l.t.toFixed(1)}</span>${l.text}</div>`).join(''):'<div class="desc">Nothing has happened yet.</div>';logDirty=false;}
function drainEvents(){if(!S||!S.events.length)return;for(const e of S.events)logs.push(e);S.events.length=0;if(logs.length>600)logs=logs.slice(-500);logDirty=true;}
function refreshPanel(force){if(!deckOpen)return;
 if(curTab==='autopsy'){updateAutopsy();updateMemory();}
 else if(curTab==='atlas'){if(force)renderAtlas();if(logDirty||force)renderLog();}
 else if(curTab==='specimen'&&force)updateCounts();}

// ---------- strip, tabs, deck ----------
$('bPlay').addEventListener('click',()=>{running=!running;updateStrip();});
$('bStep').addEventListener('click',()=>{running=false;stepOnce=true;updateStrip();});
$('bSnap').addEventListener('click',()=>{if(S)takeSnap();});
$('bRegrow').addEventListener('click',regrow);
document.querySelectorAll('#strip [data-tool]').forEach(b=>b.addEventListener('click',()=>{
 if(b.dataset.tool==='view'&&tool==='view'){if(cam.mode==='orbit')cam.mode='trackball';else{orbitFromR();cam.mode='orbit';}}
 tool=b.dataset.tool;if(tool!=='probe')probe=-1;updateStrip();layout();}));
document.querySelectorAll('#tabs .tab').forEach(b=>b.addEventListener('click',()=>{curTab=b.dataset.tab;
 if(!deckOpen){deckOpen=true;layout();}
 document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('#pane section').forEach(s=>s.hidden=s.id!=='t-'+curTab);
 if(curTab==='autopsy')requestAnimationFrame(sizeSpark);refreshPanel(true);}));
$('deckBtn').addEventListener('click',()=>{deckOpen=!deckOpen;layout();refreshPanel(true);});
window.addEventListener('resize',layout);

// ---------- main loop ----------
let uiT=0,panT=0;
function loop(ts){requestAnimationFrame(loop);
 if(S&&(running||stepOnce)){advance();stepOnce=false;}
 render();drainEvents();
 if(ts-uiT>250){uiT=ts;updateHUD();}
 if(ts-panT>500){panT=ts;refreshPanel(false);}
}
function boot(){camFromOrbit();loadAtlas();buildDeck();
 document.querySelectorAll('#pane section').forEach(s=>s.hidden=s.id!=='t-'+curTab);
 layout();regrow();updateStrip();requestAnimationFrame(loop);}
try{boot();}catch(err){const h=$('hudtxt');if(h)h.textContent='Error: '+err.message;throw err;}

</script>
</body>
</html>
