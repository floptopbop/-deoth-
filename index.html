<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scalar Field Sculpture</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --accent: rgba(255, 255, 255, 0.85);
            --dim: rgba(255, 255, 255, 0.8);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); touch-action: none;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent; position: fixed; top: 0; left: 0;
        }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        #threeCanvas {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; touch-action: none;
        }
        #hud {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            z-index: 20; display: flex; align-items: center; gap: 8px;
            padding: 7px 14px; background: rgba(10,10,18,0.82);
            border-radius: 24px; backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.09);
            pointer-events: none; flex-wrap: nowrap;
        }
        .hud-btn {
            font-family: 'SF Mono','JetBrains Mono','Courier New',monospace;
            font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--accent); background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 14px;
            padding: 4px 10px; cursor: pointer; outline: none; pointer-events: auto;
            -webkit-tap-highlight-color: transparent; white-space: nowrap;
            transition: background 0.15s, border-color 0.15s;
        }
        .hud-btn:active { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.5); }
        .hud-btn.active { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.8); }
        .hud-label {
            font-family: 'SF Mono','JetBrains Mono','Courier New',monospace;
            font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--dim); white-space: nowrap; pointer-events: none;
        }
        .hud-sep { width: 1px; height: 14px; background: rgba(255,255,255,0.12); flex-shrink: 0; }
        #exportRow {
            position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%);
            z-index: 20; display: flex; align-items: center; gap: 8px;
        }
        #toast {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(10,10,18,0.9); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px; padding: 6px 16px; z-index: 30;
            font-family: 'SF Mono','JetBrains Mono','Courier New',monospace;
            font-size: 10px; letter-spacing: 0.1em; color: rgba(255,255,255,0.8);
            opacity: 0; transition: opacity 0.25s; pointer-events: none;
        }
        #toast.show { opacity: 1; }
        .dots { display: flex; gap: 5px; }
        .dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: background 0.25s, box-shadow 0.25s;
        }
        .dot.active { background: rgba(255,255,255,0.88); box-shadow: 0 0 5px rgba(255,255,255,0.8); }
        .brush-slider {
            -webkit-appearance: none; appearance: none;
            width: 60px; height: 4px; background: rgba(255,255,255,0.2);
            border-radius: 2px; outline: none; pointer-events: auto; cursor: pointer;
        }
        .brush-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--accent); border: 1px solid rgba(255,255,255,0.8);
        }
        .brush-size-label {
            font-family: 'SF Mono','JetBrains Mono','Courier New',monospace;
            font-size: 9px; color: var(--dim); white-space: nowrap; pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas2d"></canvas>
    <canvas id="threeCanvas"></canvas>

    <div id="exportRow">
        <button class="hud-btn" id="btnLoad">LOAD</button>
        <button class="hud-btn" id="btnExportPNG">PNG</button>
        <button class="hud-btn" id="btnExportJSON">JSON</button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json,image/*" style="display:none">


    <div id="hud">
        <div class="dots" id="colorDots"></div>
        <div class="hud-sep"></div>
        <button class="hud-btn" id="btnSculpt">+</button>
        <div class="hud-sep"></div>
        <button class="hud-btn" id="btnRD" style="min-width: 70px;">/</button>
        <div class="hud-sep"></div>
        <button class="hud-btn" id="btn3D">3D</button>
        <div class="hud-sep"></div>
        <span class="brush-size-label">SIZE</span>
        <input type="range" class="brush-slider" id="brushSlider" min="3" max="80" value="6">
        <div class="hud-sep"></div>
        <span class="hud-label" id="lblEnergy">∅ 0.000</span>
    </div>

    <div id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (function() {
            // ─── CANVAS / CTX ───────────────────────────────────────────────────────────
            const canvas2d = document.getElementById('canvas2d');
            const threeCanvas = document.getElementById('threeCanvas');
            const ctx = canvas2d.getContext('2d');

            // ─── CONFIG ─────────────────────────────────────────────────────────────────
            const CELL = 3;
            let brushRadius = 6;
            let brushSigma = brushRadius / 3.0;
            const BPEAK = 4;
            const DIFF = 0.2;
            const DECAY = 0.991;
            const FIELD_CAP = 120;
            const DT2TAP = 310;
            const DT2DIST = -20;

            // ─── GRAY-SCOTT PRESETS (parameters normalized for stable reaction) ──────────
            const GS_PRESETS = [
                { name: 'OFF',       F: 0,      K: 0,      da: 0,    db: 0   },
                { name: 'CORAL',     F: 0.0545, K: 0.062,  da: 0.16, db: 0.08},
                { name: 'SPOTS',     F: 0.035,  K: 0.065,  da: 0.16, db: 0.08},
                { name: 'WAVES',     F: 0.014,  K: 0.054,  da: 0.16, db: 0.08},
                { name: 'STRIPES',   F: 0.022,  K: 0.051,  da: 0.12, db: 0.06},
                { name: 'CHAOS',     F: 0.026,  K: 0.059,  da: 0.14, db: 0.07}
            ];
            let gsPresetIdx = 0;
            let useRD = false;
            let gsF = 0, gsK = 0, gsDA = 0, gsDB = 0;

            const THRESHOLDS = [
                0.06, 0.12, 0.20, 0.30, 0.42, 0.56, 0.72,
                0.92, 1.15, 1.42, 1.75, 2.15, 2.65, 3.2, 4,
                5, 6.20, 7.70, 9.50, 11.70, 14.40, 17.70,
                21, 26.80, 32.90, 40.50, 49.90, 61.30, 75.40, 92.80, 114.10,
                140.40, 172.70, 212.40
            ];

            // ─── COLOR MODES ────────────────────────────────────────────────────────────
            function heatmapRGB(t) {
                t = Math.max(0, Math.min(1, t));
                let r,g,b;
                if (t < 0.2)      { const s=t/0.2;         r=0;             g=Math.round(s*200);       b=255; }
                else if (t < 0.4) { const s=(t-0.2)/0.2;   r=0;             g=200+Math.round(s*55);    b=Math.round(255*(1-s)); }
                else if (t < 0.55){ const s=(t-0.4)/0.15;  r=Math.round(s*255);  g=255;           b=0; }
                else if (t < 0.75){ const s=(t-0.55)/0.2;  r=255;           g=Math.round(255*(1-s*0.6)); b=0; }
                else if (t < 0.9) { const s=(t-0.75)/0.15; r=255;           g=Math.round(255*(0.4-s*0.4)); b=0; }
                else               { const s=(t-0.9)/0.1;   r=255;           g=Math.round(s*255);       b=Math.round(s*255); }
                return `rgb(${r},${g},${b})`;
            }

            const COLOR_MODES = [
                { name:'MONO', bg:'#0a0a10',
                  getColor:(ti,total,_t)=>{
                      const pal=['#1a1a24','#252530','#32323e','#41414d','#52525e','#656570',
                                '#7a7a84','#919199','#aaaab0','#c4c4c8','#dedee0','#f0f0f2','#fafafc','#ffffff'];
                      return pal[Math.min(ti,pal.length-1)];
                  }, dotColor:'#ffffff', grid:false },
                { name:'HEAT', bg:'#060608',
                  getColor:(ti,total,_t)=>heatmapRGB(ti/total), dotColor:'#ff4400', grid:false },
                { name:'AMBER', bg:'#0c0a06',
                  getColor:(ti,total,_t)=>{
                      const p=['#1a1208','#281c0c','#382812','#4a3618','#5e4420','#735428',
                              '#8a662e','#a37a36','#bd903e','#d6a848','#ecc254','#f9d668','#fde882','#fff3a0'];
                      return p[Math.min(ti,p.length-1)];
                  }, dotColor:'#ffd060', grid:false },
                { name:'BLUEPRINT', bg:'#04080f',
                  getColor:(ti,total,_t)=>{
                      const t=ti/total;
                      const r=Math.round(t*80), g=Math.round(80+t*175), b=Math.round(160+t*95);
                      return `rgb(${r},${g},${b})`;
                  }, dotColor:'#44c8f0', grid:true },
                { name:'TOPO', bg:'#0a0c08',
                  getColor:(ti,total,_t)=>{
                      const p=['#1a2e12','#25441c','#325a26','#427032','#548840','#68a050',
                              '#7eb862','#96d076','#b0e48c','#ccf2a4','#e4f7c2','#f4fadc','#fcf8e8','#fff8e0'];
                      return p[Math.min(ti,p.length-1)];
                  }, dotColor:'#96d076', grid:true },
            ];

            // ─── STATE ───────────────────────────────────────────────────────────────────
            let numCols, numRows;
            let fieldA, fieldB, fieldV, fieldVNext;
            let useA = true;
            let fieldMax=0, fieldMin=0, fieldSum=0, fieldCount=0;
            let fieldStamp=1; // bumped whenever the field actually changes — drives dirty-checked rendering

            let colorMode  = 0;
            let sculptMode = 0;
            let sculptSign = 1;
            let in3D = false;
            let frozenBuf = null;

            let pendingDeposits = [];
            let activeTouches = new Map();
            let twoFingerActive = false;
            let lastTapTime=0, lastTapX=0, lastTapY=0;

            // ─── BRUSH KERNEL ───────────────────────────────────────────────────────────
            let brushKernel = [];
            function buildBrush() {
                brushKernel = [];
                for (let dy = -brushRadius; dy <= brushRadius; dy++) {
                    for (let dx = -brushRadius; dx <= brushRadius; dx++) {
                        const d2 = dx*dx + dy*dy;
                        if (d2 <= brushRadius*brushRadius) {
                            const w = BPEAK * Math.exp(-d2/(2*brushSigma*brushSigma));
                            if (w > 0.001) brushKernel.push({dx, dy, w});
                        }
                    }
                }
            }
            buildBrush();

            const brushSlider = document.getElementById('brushSlider');
            brushSlider.addEventListener('input', () => {
                brushRadius = parseInt(brushSlider.value);
                brushSigma = brushRadius / 3.0;
                buildBrush();
            });

            // ─── FIELD HELPERS ──────────────────────────────────────────────────────────
            function getBuf(a) { return a ? fieldA : fieldB; }
            function fi(c,r)   { return r*(numCols+1)+c; }
            function fv(buf,c,r){
                if (c<0||c>numCols||r<0||r>numRows) return 0;
                return buf[fi(c,r)];
            }

            function resizeGrid() {
                const dpr = window.devicePixelRatio||1;
                const W=window.innerWidth, H=window.innerHeight;
                canvas2d.width  = Math.floor(W*dpr);
                canvas2d.height = Math.floor(H*dpr);
                canvas2d.style.width  = W+'px';
                canvas2d.style.height = H+'px';
                ctx.setTransform(1,0,0,1,0,0);
                ctx.scale(dpr,dpr);
                numCols = Math.max(30, Math.floor(W/CELL));
                numRows = Math.max(40, Math.floor(H/CELL));
                const n=(numCols+1)*(numRows+1);
                fieldA = new Float32Array(n);
                fieldB = new Float32Array(n);
                fieldV = new Float32Array(n);
                fieldVNext = new Float32Array(n);
                useA=true; fieldMax=0; fieldMin=0; fieldSum=0; fieldCount=n; frozenBuf=null;
                fieldStamp++;
            }

            function resetField() {
                const n=(numCols+1)*(numRows+1);
                fieldA=new Float32Array(n); fieldB=new Float32Array(n); fieldV=new Float32Array(n);
                fieldVNext=new Float32Array(n);
                useA=true; fieldMax=0; fieldMin=0; fieldSum=0; fieldCount=n; frozenBuf=null; pendingDeposits=[];
                fieldStamp++;
                if (in3D) exit3D();
            }

            // ─── DEPOSIT ────────────────────────────────────────────────────────────────
            function deposit(sx,sy,sign) {
                const cc=Math.round(sx/CELL), rc=Math.round(sy/CELL);
                const buf = frozenBuf || getBuf(useA);
                for (const k of brushKernel) {
                    const c=cc+k.dx, r=rc+k.dy;
                    if (c>=0&&c<=numCols&&r>=0&&r<=numRows) {
                        const idx=fi(c,r);
                        const nv = Math.max(-FIELD_CAP, Math.min(FIELD_CAP, buf[idx] + k.w * sign));
                        buf[idx]=nv;
                        if (nv>fieldMax) fieldMax=nv;
                        if (nv<fieldMin) fieldMin=nv;
                    }
                }
            }

            function depositLine(x0,y0,x1,y1,sign) {
                const dist=Math.hypot(x1-x0,y1-y0);
                const step = CELL * brushRadius * 0.4;
                const steps=Math.max(1,Math.ceil(dist/step));
                for (let i=0;i<=steps;i++) {
                    const t=i/steps;
                    deposit(x0+(x1-x0)*t, y0+(y1-y0)*t, sign);
                }
            }

            // ─── SIMULATION (with normalized Gray-Scott) ─────────────────────────────────
            function updateField() {
                if (pendingDeposits.length) {
                    for (const d of pendingDeposits) {
                        const s = sculptMode===1 ? -1 : 1;
                        if (d.length===2) deposit(d[0],d[1],s);
                        else              depositLine(d[0],d[1],d[2],d[3],s);
                    }
                    pendingDeposits=[];
                    fieldStamp++;
                }

                if (sculptMode===2) return;
                // Field fully decayed to zero and nothing incoming — nothing to simulate.
                if (!useRD && fieldMax===0 && fieldMin===0) return;

                const old=getBuf(useA);
                const nxt=getBuf(!useA);
                let mx=-Infinity, mn=Infinity, sm=0;

                if (useRD && gsPresetIdx > 0) {
                    // Normalize U and V to [0,1] for stable reaction
                    const uBuf = old;
                    const vBuf = fieldV;
                    const uNew = nxt;
                    const vNew = fieldVNext; // persistent scratch — no per-frame allocation
                    
                    // Find max values for normalization
                    let maxU = 0, maxV = 0;
                    for (let i=0; i<uBuf.length; i++) {
                        if (uBuf[i] > maxU) maxU = uBuf[i];
                        if (vBuf[i] > maxV) maxV = vBuf[i];
                    }
                    // Avoid division by zero
                    const uScale = maxU > 0.001 ? maxU : 1;
                    const vScale = maxV > 0.001 ? maxV : 1;

                    const dt = 0.2;  // time step factor
                    for (let r=0;r<=numRows;r++) {
                        for (let c=0;c<=numCols;c++) {
                            const idx = fi(c,r);
                            const uRaw = uBuf[idx];
                            const vRaw = vBuf[idx];
                            // Normalize
                            const u = uRaw / uScale;
                            const v = vRaw / vScale;

                            // Laplacian (normalized)
                            const un = (r>0 ? uBuf[fi(c,r-1)] : uRaw) / uScale;
                            const us = (r<numRows ? uBuf[fi(c,r+1)] : uRaw) / uScale;
                            const uw = (c>0 ? uBuf[fi(c-1,r)] : uRaw) / uScale;
                            const ue = (c<numCols ? uBuf[fi(c+1,r)] : uRaw) / uScale;
                            const lapU = un+us+uw+ue - 4*u;

                            const vn = (r>0 ? vBuf[fi(c,r-1)] : vRaw) / vScale;
                            const vs = (r<numRows ? vBuf[fi(c,r+1)] : vRaw) / vScale;
                            const vw = (c>0 ? vBuf[fi(c-1,r)] : vRaw) / vScale;
                            const ve = (c<numCols ? vBuf[fi(c+1,r)] : vRaw) / vScale;
                            const lapV = vn+vs+vw+ve - 4*v;

                            const uvv = u * v * v;
                            const nu = Math.max(0, Math.min(1, u + gsDA * lapU * dt - uvv * dt + gsF * (1-u) * dt));
                            const nv = Math.max(0, Math.min(1, v + gsDB * lapV * dt + uvv * dt - (gsK+gsF) * v * dt));

                            // Denormalize back to original scale
                            uNew[idx] = nu * uScale;
                            vNew[idx] = nv * vScale;
                            if (uNew[idx] > mx) mx = uNew[idx];
                            sm += uNew[idx];
                        }
                    }
                    const _vt=fieldV; fieldV=fieldVNext; fieldVNext=_vt;
                } else {
                    // Standard diffusion
                    for (let r=0;r<=numRows;r++) {
                        for (let c=0;c<=numCols;c++) {
                            const idx=fi(c,r);
                            const center=old[idx];
                            const n=r>0?old[fi(c,r-1)]:0;
                            const s=r<numRows?old[fi(c,r+1)]:0;
                            const w=c>0?old[fi(c-1,r)]:0;
                            const e=c<numCols?old[fi(c+1,r)]:0;
                            let nv=center+DIFF*(n+s+w+e-4*center);
                            nv*=DECAY;
                            if (Math.abs(nv)<0.0001) nv=0;
                            nv=Math.max(-FIELD_CAP, Math.min(FIELD_CAP, nv));
                            nxt[idx]=nv;
                            if (nv>mx) mx=nv; if (nv<mn) mn=nv; sm+=nv;
                        }
                    }
                }
                fieldMax=mx===-Infinity?0:mx; fieldSum=sm;
                fieldMin=mn===Infinity?0:Math.min(0,mn);
                fieldStamp++;
                useA=!useA;
            }

            // ─── GRAY-SCOTT PRESET HANDLER ──────────────────────────────────────────────
            function applyGsPreset(idx) {
                const prevIdx = gsPresetIdx;
                gsPresetIdx = idx;
                const preset = GS_PRESETS[idx];
                if (idx === 0) {
                    useRD = false;
                    gsF=gsK=gsDA=gsDB=0;
                } else {
                    useRD = true;
                    gsF = preset.F;
                    gsK = preset.K;
                    gsDA = preset.da;
                    gsDB = preset.db;
                    // Seed V channel from current U (normalized) only when first enabling RD
                    if (prevIdx === 0) {
                        const u = getBuf(useA);
                        const mx = Math.max(fieldMax, 0.001);
                        for (let i=0; i<fieldV.length; i++) {
                            const un = u[i] / mx;
                            fieldV[i] = Math.min(1, un * 0.25) * mx; // scale back up
                        }
                    }
                }
            }

            function cycleGsPreset() {
                if (in3D) return;
                const nextIdx = (gsPresetIdx + 1) % GS_PRESETS.length;
                applyGsPreset(nextIdx);
                const preset = GS_PRESETS[nextIdx];
                toast(nextIdx === 0 ? 'Reaction-Diffusion OFF' : `RD: ${preset.name}`);
                updateHUD();
            }

            // ─── MARCHING SQUARES ───────────────────────────────────────────────────────
            const MS_EDGES=[
                [],[['t','l']],[['t','r']],[['r','l']],
                [['r','b']],[['t','l'],['r','b']],[['t','b']],[['b','l']],
                [['b','l']],[['t','b']],[['t','r'],['b','l']],[['r','b']],
                [['r','l']],[['t','r']],[['t','l']],[]
            ];

            function edgePt(c,r,edge,thresh,buf) {
                const x0=c*CELL,y0=r*CELL,x1=(c+1)*CELL,y1=(r+1)*CELL;
                const TL=fv(buf,c,r),TR=fv(buf,c+1,r),BR=fv(buf,c+1,r+1),BL=fv(buf,c,r+1);
                let a,b,ax,ay,bx,by;
                switch(edge){
                    case 't': a=TL;b=TR;ax=x0;ay=y0;bx=x1;by=y0; break;
                    case 'r': a=TR;b=BR;ax=x1;ay=y0;bx=x1;by=y1; break;
                    case 'b': a=BL;b=BR;ax=x0;ay=y1;bx=x1;by=y1; break;
                    case 'l': a=TL;b=BL;ax=x0;ay=y0;bx=x0;by=y1; break;
                    default: return null;
                }
                const d=b-a; if (Math.abs(d)<1e-9) return null;
                const t=Math.max(0,Math.min(1,(thresh-a)/d));
                return {x:ax+t*(bx-ax),y:ay+t*(by-ay)};
            }

            function msCase(buf,c,r,t){
                let i=0;
                if (fv(buf,c,r)>=t)   i|=1;
                if (fv(buf,c+1,r)>=t) i|=2;
                if (fv(buf,c+1,r+1)>=t) i|=4;
                if (fv(buf,c,r+1)>=t) i|=8;
                return i;
            }

            // ─── 2D RENDER ──────────────────────────────────────────────────────────────
            function render2D() {
                const buf = frozenBuf || getBuf(useA);
                const cm  = COLOR_MODES[colorMode];
                const W=window.innerWidth, H=window.innerHeight;

                ctx.fillStyle=cm.bg; ctx.fillRect(0,0,W,H);

                if (cm.grid) {
                    ctx.strokeStyle='rgba(140,170,210,0.06)';
                    ctx.lineWidth=0.4; ctx.beginPath();
                    const sp=CELL*8;
                    for (let x=sp;x<W;x+=sp){ctx.moveTo(x,0);ctx.lineTo(x,H);}
                    for (let y=sp;y<H;y+=sp){ctx.moveTo(0,y);ctx.lineTo(W,y);}
                    ctx.stroke();
                }

                const T=THRESHOLDS;
                for (let ti=0;ti<T.length;ti++) {
                    const thresh=T[ti];
                    if (thresh > fieldMax) break; // thresholds ascend — nothing exists above the peak
                    ctx.strokeStyle=cm.getColor(ti,T.length-1,thresh);
                    ctx.lineWidth=1+(ti/T.length)*0.9;
                    ctx.lineCap='round'; ctx.lineJoin='round';
                    ctx.beginPath();
                    for (let r=0;r<numRows;r++) {
                        for (let c=0;c<numCols;c++) {
                            const ci=msCase(buf,c,r,thresh);
                            if (ci===0||ci===15) continue;
                            for (const pair of MS_EDGES[ci]) {
                                const p0=edgePt(c,r,pair[0],thresh,buf);
                                const p1=edgePt(c,r,pair[1],thresh,buf);
                                if (p0&&p1){ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);}
                            }
                        }
                    }
                    ctx.stroke();
                }

                if (fieldMax>0.01) {
                    const pk=fieldMax*0.9999;
                    ctx.strokeStyle=cm.getColor(T.length-1,T.length-1,pk);
                    ctx.lineWidth=3; ctx.globalAlpha=0.5; ctx.beginPath();
                    for (let r=0;r<numRows;r++) {
                        for (let c=0;c<numCols;c++) {
                            const ci=msCase(buf,c,r,pk);
                            if (ci===0||ci===15) continue;
                            for (const pair of MS_EDGES[ci]) {
                                const p0=edgePt(c,r,pair[0],pk,buf);
                                const p1=edgePt(c,r,pair[1],pk,buf);
                                if (p0&&p1){ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);}
                            }
                        }
                    }
                    ctx.stroke(); ctx.globalAlpha=1;
                }
            }

            // ─── THREE.JS 3D VIEW ───────────────────────────────────────────────────────
            let three = null;
            let renderer3 = null; // persistent — one WebGL context for the app's lifetime

            function buildColorLUT() {
                // One entry per contour tier — exact same mapping the per-vertex path used,
                // minus the per-vertex CSS string parsing and THREE.Color allocation.
                const cm = COLOR_MODES[colorMode];
                const N = THRESHOLDS.length;
                const lut = new Float32Array(N*3);
                const tc = new THREE.Color();
                for (let i=0;i<N;i++) {
                    tc.set(cm.getColor(i, N-1, 0));
                    lut[i*3]=tc.r; lut[i*3+1]=tc.g; lut[i*3+2]=tc.b;
                }
                return lut;
            }

            function enter3D() {
                canvas2d.style.display='none';
                threeCanvas.style.display='block';
                in3D=true;

                if (three) { disposethree(); }

                const W=window.innerWidth, H=window.innerHeight;
                if (!renderer3) {
                    renderer3=new THREE.WebGLRenderer({canvas:threeCanvas,antialias:true,alpha:false,preserveDrawingBuffer:false});
                }
                renderer3.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
                renderer3.setSize(W,H);
                renderer3.setClearColor(0x04060a,1);

                const scene=new THREE.Scene();
                const meshW = numCols*CELL;
                const meshD = numRows*CELL;
                const maxElev = meshD * 0.3;

                const camera=new THREE.PerspectiveCamera(55,W/H,1,meshD*6);

                const gW=numCols, gH=numRows;
                const geo=new THREE.PlaneGeometry(meshW, meshD, gW, gH);
                geo.rotateX(-Math.PI/2);
                geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count*3),3));

                let lut=buildColorLUT();
                const tLen=THRESHOLDS.length-1;

                function refreshMesh() {
                    const buf = frozenBuf || getBuf(useA);
                    const mxv = Math.max(fieldMax, 0.001);
                    const posArr = geo.attributes.position.array;
                    const colArr = geo.attributes.color.array;
                    for (let j=0;j<=gH;j++) {
                        for (let i=0;i<=gW;i++) {
                            const vi=j*(gW+1)+i;
                            const val=buf[fi(i,j)]||0;
                            const t=Math.max(0,val)/mxv;
                            posArr[vi*3+1]=t*maxElev;
                            const li=Math.round(t*tLen)*3;
                            colArr[vi*3]=lut[li]; colArr[vi*3+1]=lut[li+1]; colArr[vi*3+2]=lut[li+2];
                        }
                    }
                    geo.attributes.position.needsUpdate=true;
                    geo.attributes.color.needsUpdate=true;
                    geo.computeVertexNormals();
                }
                refreshMesh();

                const mat=new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.65, metalness:0.05, side:THREE.DoubleSide});
                const mesh=new THREE.Mesh(geo,mat);
                scene.add(mesh);

                const wireMat=new THREE.MeshBasicMaterial({color:0x1a2a3a,wireframe:true,transparent:true,opacity:0.5});
                const wireframeMesh=new THREE.Mesh(geo, wireMat);
                scene.add(wireframeMesh);

                scene.add(new THREE.AmbientLight(0xffffff,0.35));
                const dir=new THREE.DirectionalLight(0xffffff,1.1);
                dir.position.set(meshW*0.6, meshD*0.7, meshD*0.4);
                scene.add(dir);
                const fill=new THREE.DirectionalLight(0x6688bb,0.4);
                fill.position.set(-meshW*0.5, meshD*0.3, -meshD*0.3);
                scene.add(fill);

                let isDragging=false, prevX=0, prevY=0;
                let theta=-0.3, phi=0.42;
                let radius=meshD*0.95;
                const target=new THREE.Vector3(0, maxElev*0.2, 0);

                function updateCamera() {
                    camera.position.x=target.x+radius*Math.sin(phi)*Math.sin(theta);
                    camera.position.y=target.y+radius*Math.cos(phi);
                    camera.position.z=target.z+radius*Math.sin(phi)*Math.cos(theta);
                    camera.lookAt(target);
                }
                updateCamera();

                let pinchStartDist=0, pinchStartRadius=0;
                let touchOrbit=[];

                function tcDist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}

                const touchStartHandler = (e) => {
                    e.preventDefault();
                    touchOrbit=[...e.touches];
                    if (touchOrbit.length===1){isDragging=true;prevX=touchOrbit[0].clientX;prevY=touchOrbit[0].clientY;}
                    if (touchOrbit.length===2){pinchStartDist=tcDist(touchOrbit[0],touchOrbit[1]);pinchStartRadius=radius;}
                };
                const touchMoveHandler = (e) => {
                    e.preventDefault();
                    const touches=[...e.touches];
                    if (touches.length===1&&isDragging){
                        const dx=touches[0].clientX-prevX, dy=touches[0].clientY-prevY;
                        theta-=dx*0.007; phi=Math.max(0.05,Math.min(Math.PI*0.95,phi-dy*0.007));
                        prevX=touches[0].clientX; prevY=touches[0].clientY;
                        updateCamera();
                    }
                    if (touches.length===2){
                        const d=tcDist(touches[0],touches[1]);
                        radius=Math.max(50,Math.min(numRows*CELL*3,pinchStartRadius*(pinchStartDist/d)));
                        updateCamera();
                    }
                };
                const touchEndHandler = (e) => {
                    e.preventDefault();
                    touchOrbit=[...e.touches];
                    if (touchOrbit.length<1) isDragging=false;
                };
                const mouseDownHandler = (e) => { isDragging=true; prevX=e.clientX; prevY=e.clientY; };
                const mouseMoveHandler = (e) => {
                    if (!isDragging) return;
                    const dx=e.clientX-prevX, dy=e.clientY-prevY;
                    theta-=dx*0.005; phi=Math.max(0.05,Math.min(Math.PI*0.95,phi-dy*0.005));
                    prevX=e.clientX; prevY=e.clientY; updateCamera();
                };
                const mouseUpHandler = () => { isDragging=false; };
                const wheelHandler = (e) => {
                    radius=Math.max(50,Math.min(numRows*CELL*3,radius+e.deltaY*0.5));
                    updateCamera(); e.preventDefault();
                };

                threeCanvas.addEventListener('touchstart', touchStartHandler, {passive:false});
                threeCanvas.addEventListener('touchmove', touchMoveHandler, {passive:false});
                threeCanvas.addEventListener('touchend', touchEndHandler, {passive:false});
                threeCanvas.addEventListener('mousedown', mouseDownHandler);
                threeCanvas.addEventListener('mousemove', mouseMoveHandler);
                threeCanvas.addEventListener('mouseup', mouseUpHandler);
                threeCanvas.addEventListener('wheel', wheelHandler, {passive:false});

                three = {
                    scene, camera, geo, mat, wireMat,
                    animId: 0,
                    builtStamp: fieldStamp,
                    builtColor: colorMode,
                    listeners: {
                        touchstart: touchStartHandler,
                        touchmove: touchMoveHandler,
                        touchend: touchEndHandler,
                        mousedown: mouseDownHandler,
                        mousemove: mouseMoveHandler,
                        mouseup: mouseUpHandler,
                        wheel: wheelHandler
                    }
                };

                function step() {
                    if (!three) return; // loop was disposed mid-flight
                    three.animId = requestAnimationFrame(step); // re-stored every frame so cancel always hits the live id
                    if (fieldStamp!==three.builtStamp || colorMode!==three.builtColor) {
                        if (colorMode!==three.builtColor) lut=buildColorLUT();
                        refreshMesh();
                        three.builtStamp=fieldStamp;
                        three.builtColor=colorMode;
                    }
                    renderer3.render(scene, camera);
                }
                three.animId = requestAnimationFrame(step);
            }

            function disposethree() {
                if (!three) return;
                cancelAnimationFrame(three.animId);
                const l = three.listeners;
                threeCanvas.removeEventListener('touchstart', l.touchstart);
                threeCanvas.removeEventListener('touchmove', l.touchmove);
                threeCanvas.removeEventListener('touchend', l.touchend);
                threeCanvas.removeEventListener('mousedown', l.mousedown);
                threeCanvas.removeEventListener('mousemove', l.mousemove);
                threeCanvas.removeEventListener('mouseup', l.mouseup);
                threeCanvas.removeEventListener('wheel', l.wheel);
                three.geo.dispose();
                three.mat.dispose();
                three.wireMat.dispose();
                three = null;
                // Shrink the hidden canvas's drawing buffer — releases the full-res
                // MSAA backbuffer on the GPU instead of pinning it while in 2D.
                if (renderer3) renderer3.setSize(2,2,false);
            }

            function exit3D() {
                in3D=false;
                disposethree();
                threeCanvas.style.display='none';
                canvas2d.style.display='block';
                drawnStamp=-1; // force an immediate 2D repaint
                updateSculptBtn();
            }

            // ─── EXPORT ─────────────────────────────────────────────────────────────────
            function exportPNG() {
                if (in3D && three) {
                    renderer3.render(three.scene,three.camera);
                    const url=threeCanvas.toDataURL('image/png');
                    const a=document.createElement('a'); a.href=url; a.download='scalar_field_3d.png'; a.click();
                    toast('PNG saved (3D)');
                } else {
                    render2D();
                    const url=canvas2d.toDataURL('image/png');
                    const a=document.createElement('a'); a.href=url; a.download='scalar_field.png'; a.click();
                    toast('PNG saved');
                }
            }

            function exportJSON() {
                const buf=frozenBuf||getBuf(useA);
                const payload={
                    version:1, numCols, numRows, cellSize:CELL,
                    width:numCols*CELL, height:numRows*CELL,
                    fieldMax, colorMode:COLOR_MODES[colorMode].name, useRD,
                    gsPreset: GS_PRESETS[gsPresetIdx].name,
                    field:Array.from(buf)
                };
                const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
                const url=URL.createObjectURL(blob);
                const a=document.createElement('a'); a.href=url; a.download='scalar_field.json'; a.click();
                URL.revokeObjectURL(url);
                toast('JSON exported — '+numCols+'×'+numRows+' grid');
            }

            // ─── LOAD (exported JSON field, or image → luminance seed) ──────────────────
            function recomputeStats(buf) {
                let mx=-Infinity, mn=Infinity, sm=0;
                for (let i=0;i<buf.length;i++){const v=buf[i]; if(v>mx)mx=v; if(v<mn)mn=v; sm+=v;}
                fieldMax=mx===-Infinity?0:mx;
                fieldMin=mn===Infinity?0:Math.min(0,mn);
                fieldSum=sm; fieldCount=buf.length;
            }

            function seedVFromU(buf) {
                const mx=Math.max(fieldMax,0.001);
                for (let i=0;i<fieldV.length;i++){const un=buf[i]/mx; fieldV[i]=Math.min(1,un*0.25)*mx;}
            }

            function applyLoadedJSON(payload) {
                if (!payload || !Array.isArray(payload.field)) throw new Error('bad payload');
                const sC=payload.numCols|0, sR=payload.numRows|0;
                if ((sC+1)*(sR+1)!==payload.field.length) throw new Error('field size mismatch');
                const src=payload.field;
                const target=frozenBuf||getBuf(useA);
                target.fill(0);
                const scX=(sC+1)/(numCols+1), scY=(sR+1)/(numRows+1);
                for (let r=0;r<=numRows;r++){
                    for (let c=0;c<=numCols;c++){
                        const sc3=Math.round(c*scX), sr3=Math.round(r*scY);
                        if (sc3>=0&&sc3<=sC&&sr3>=0&&sr3<=sR) target[fi(c,r)]=src[sr3*(sC+1)+sc3];
                    }
                }
                if (frozenBuf) getBuf(useA).set(frozenBuf);
                fieldV.fill(0);
                recomputeStats(target);
                if (typeof payload.colorMode==='string'){
                    const ci=COLOR_MODES.findIndex(m=>m.name===payload.colorMode);
                    if (ci>=0) colorMode=ci;
                }
                if (typeof payload.gsPreset==='string'){
                    const gi=GS_PRESETS.findIndex(p=>p.name===payload.gsPreset);
                    applyGsPreset(gi>=0?gi:0);
                } else applyGsPreset(0);
                fieldStamp++;
                updateHUD();
                toast('Field loaded — '+sC+'×'+sR+' → '+numCols+'×'+numRows);
            }

            function applyLoadedImage(img) {
                const w=numCols+1, h=numRows+1;
                const oc=document.createElement('canvas'); oc.width=w; oc.height=h;
                const octx=oc.getContext('2d');
                octx.drawImage(img,0,0,w,h);
                const data=octx.getImageData(0,0,w,h).data;
                const target=frozenBuf||getBuf(useA);
                const PEAK=24; // lands the tonal range across the mid contour bands
                for (let r=0;r<h;r++){
                    for (let c=0;c<w;c++){
                        const p=(r*w+c)*4;
                        const lum=(0.2126*data[p]+0.7152*data[p+1]+0.0722*data[p+2])/255;
                        target[fi(c,r)]=Math.pow(lum,1.4)*PEAK;
                    }
                }
                if (frozenBuf) getBuf(useA).set(frozenBuf);
                recomputeStats(target);
                if (useRD) seedVFromU(target); else fieldV.fill(0);
                fieldStamp++;
                updateHUD();
                toast('Image seeded — luminance → field');
            }

            const fileInput=document.getElementById('fileInput');
            document.getElementById('btnLoad').addEventListener('click',e=>{
                e.stopPropagation(); fileInput.click();
            });
            fileInput.addEventListener('change',()=>{
                const f=fileInput.files&&fileInput.files[0];
                fileInput.value='';
                if (!f) return;
                if (f.type==='application/json'||/\.json$/i.test(f.name)) {
                    const rd=new FileReader();
                    rd.onload=()=>{ try{ applyLoadedJSON(JSON.parse(rd.result)); }catch(err){ toast('Load failed — bad field JSON'); } };
                    rd.onerror=()=>toast('Load failed');
                    rd.readAsText(f);
                } else if (/^image\//.test(f.type)) {
                    const url=URL.createObjectURL(f);
                    const img=new Image();
                    img.onload=()=>{ try{ applyLoadedImage(img); }catch(err){ toast('Load failed'); } URL.revokeObjectURL(url); };
                    img.onerror=()=>{ URL.revokeObjectURL(url); toast('Load failed — bad image'); };
                    img.src=url;
                } else toast('Unsupported file type');
            });

            // ─── HUD ────────────────────────────────────────────────────────────────────
            const dotsEl=document.getElementById('colorDots');
            COLOR_MODES.forEach((_,i)=>{
                const d=document.createElement('span'); d.className='dot';
                if (i===0) d.classList.add('active');
                dotsEl.appendChild(d);
            });
            const dotEls=dotsEl.querySelectorAll('.dot');

            function updateSculptBtn() {
                const b=document.getElementById('btnSculpt');
                if (sculptMode===0) b.textContent='+';
                else if (sculptMode===1) b.textContent='−';
                else b.textContent='❄';
                b.classList.toggle('active', sculptMode===2);
            }

            function updateHUD() {
                dotEls.forEach((d,i)=>{
                    d.classList.toggle('active',i===colorMode);
                    d.style.background=i===colorMode?COLOR_MODES[i].dotColor:'rgba(255,255,255,0.2)';
                });
                updateEnergyLabel();
                const btnRD = document.getElementById('btnRD');
                btnRD.textContent = GS_PRESETS[gsPresetIdx].name;
                btnRD.classList.toggle('active', useRD);
                document.getElementById('btn3D').classList.toggle('active',in3D);
                updateSculptBtn();
                if (parseInt(brushSlider.value) !== brushRadius) {
                    brushSlider.value = brushRadius;
                }
            }

            // ─── BUTTON EVENTS ──────────────────────────────────────────────────────────
            document.getElementById('btnSculpt').addEventListener('click',e=>{
                e.stopPropagation();
                if (in3D) return;
                sculptMode=(sculptMode+1)%3;
                if (sculptMode===2) {
                    frozenBuf=getBuf(useA).slice();
                } else {
                    sculptSign=sculptMode===0?1:-1;
                    if (frozenBuf) {
                        const live=getBuf(useA);
                        live.set(frozenBuf);
                        frozenBuf=null;
                    }
                }
                updateHUD();
            });

            document.getElementById('btnRD').addEventListener('click',e=>{
                e.stopPropagation();
                cycleGsPreset();
            });

            document.getElementById('btn3D').addEventListener('click',e=>{
                e.stopPropagation();
                if (in3D) { exit3D(); updateHUD(); }
                else { enter3D(); updateHUD(); }
            });

            document.getElementById('btnExportPNG').addEventListener('click',e=>{e.stopPropagation();exportPNG();});
            document.getElementById('btnExportJSON').addEventListener('click',e=>{e.stopPropagation();exportJSON();});

            // ─── TOUCH on 2D canvas ─────────────────────────────────────────────────────
            function sc(t) { return {x:t.clientX,y:t.clientY}; }

            canvas2d.addEventListener('touchstart',e=>{
                if (in3D) return;
                e.preventDefault();
                const now=performance.now();
                for (const t of e.changedTouches) {
                    const c=sc(t);
                    activeTouches.set(t.identifier,{x:c.x,y:c.y,sx:c.x,sy:c.y,st:now,moved:false,px:c.x,py:c.y});
                }
                if (activeTouches.size===1) {
                    twoFingerActive=false;
                    const d=activeTouches.values().next().value;
                    if (now-lastTapTime<DT2TAP&&Math.hypot(d.sx-lastTapX,d.sy-lastTapY)<DT2DIST){
                        resetField(); lastTapTime=0; activeTouches.clear(); updateHUD(); return;
                    }
                    pendingDeposits.push([d.x,d.y]);
                } else if (activeTouches.size>=2 && !twoFingerActive) {
                    twoFingerActive=true;
                    colorMode=(colorMode+1)%COLOR_MODES.length;
                    pendingDeposits=[];
                    updateHUD();
                }
            },{passive:false});

            canvas2d.addEventListener('touchmove',e=>{
                if (in3D) return;
                e.preventDefault();
                for (const t of e.changedTouches) {
                    const d=activeTouches.get(t.identifier); if (!d) continue;
                    const c=sc(t);
                    if (Math.abs(c.x-d.sx)>3||Math.abs(c.y-d.sy)>3) d.moved=true;
                    if (activeTouches.size===1&&!twoFingerActive) {
                        pendingDeposits.push([d.px,d.py,c.x,c.y]);
                    }
                    d.px=c.x; d.py=c.y; d.x=c.x; d.y=c.y;
                }
            },{passive:false});

            canvas2d.addEventListener('touchend',e=>{
                if (in3D) return;
                e.preventDefault();
                const now=performance.now();
                for (const t of e.changedTouches) {
                    const d=activeTouches.get(t.identifier);
                    if (!d){activeTouches.delete(t.identifier);continue;}
                    if (!d.moved&&activeTouches.size===1&&!twoFingerActive&&now-d.st<250){
                        lastTapTime=now; lastTapX=d.sx; lastTapY=d.sy;
                    }
                    activeTouches.delete(t.identifier);
                }
                if (activeTouches.size===0){twoFingerActive=false;pendingDeposits=[];}
                else if (activeTouches.size===1&&twoFingerActive){
                    twoFingerActive=false;
                    const rem=activeTouches.values().next().value;
                    if (rem){rem.px=rem.x;rem.py=rem.y;rem.sx=rem.x;rem.sy=rem.y;rem.st=now;rem.moved=false;}
                }
            },{passive:false});

            canvas2d.addEventListener('touchcancel',e=>{
                e.preventDefault(); activeTouches.clear(); twoFingerActive=false; pendingDeposits=[];
            },{passive:false});
            canvas2d.addEventListener('contextmenu',e=>e.preventDefault());

            // ─── RESIZE ─────────────────────────────────────────────────────────────────
            window.addEventListener('resize',()=>{
                clearTimeout(window._rsz);
                window._rsz=setTimeout(()=>{
                    if (in3D){exit3D();}
                    const oldBuf=getBuf(useA),oC=numCols,oR=numRows;
                    resizeGrid();
                    const nB=getBuf(useA);
                    const sc2=(oC+1)/(numCols+1),sr2=(oR+1)/(numRows+1);
                    for (let r=0;r<=numRows;r++){
                        for (let c=0;c<=numCols;c++){
                            const sc3=Math.round(c*sc2),sr3=Math.round(r*sr2);
                            if (sc3>=0&&sc3<=oC&&sr3>=0&&sr3<=oR) nB[fi(c,r)]=oldBuf[sr3*(oC+1)+sc3];
                        }
                    }
                    let mx=-Infinity,mn=Infinity,sm=0;
                    for (let i=0;i<nB.length;i++){const v=nB[i];if(v>mx)mx=v;if(v<mn)mn=v;sm+=v;}
                    fieldMax=mx===-Infinity?0:mx; fieldMin=mn===Infinity?0:Math.min(0,mn); fieldSum=sm; fieldCount=nB.length;
                    updateHUD();
                },200);
            });

            // ─── TOAST ──────────────────────────────────────────────────────────────────
            let toastTimer;
            function toast(msg) {
                const el=document.getElementById('toast');
                el.textContent=msg; el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
            }

            // ─── MAIN LOOP ──────────────────────────────────────────────────────────────
            let drawnStamp=-1, drawnColor=-1, drawnFrozen=null, hudTick=0, lastEnergyTxt='';
            function updateEnergyLabel() {
                const avg=fieldCount>0?fieldSum/fieldCount:0;
                const txt='Σ '+avg.toFixed(3);
                if (txt!==lastEnergyTxt){ lastEnergyTxt=txt; document.getElementById('lblEnergy').textContent=txt; }
            }
            function loop() {
                updateField();
                if (!in3D) {
                    const frozen = sculptMode===2;
                    if (fieldStamp!==drawnStamp || colorMode!==drawnColor || frozen!==drawnFrozen) {
                        render2D();
                        drawnStamp=fieldStamp; drawnColor=colorMode; drawnFrozen=frozen;
                    }
                }
                if ((hudTick++ & 7)===0) updateEnergyLabel(); // label at ~7Hz instead of full HUD DOM writes at 60Hz
                requestAnimationFrame(loop);
            }

            resizeGrid();
            applyGsPreset(0);
            updateHUD();
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
